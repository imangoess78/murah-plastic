<body>
<div id="site-nav"></div>

<div class="wrap">
  <div class="page-head">
    <div class="page-title">📝 Artikel & Tips</div>

<script>
(function () {
  const SP = MP;
  const el = document.getElementById('articleList');
  const fmtDate = d => { try { return new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}); } catch(e){ return String(d||'').slice(0,10); } };
  const stripHtml = s => String(s||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
  const trunc = (s,n) => { const t=stripHtml(s); return t.length>n ? t.slice(0,n).trimEnd()+'…' : t; };

  fetch('/api/articles').then(r => r.json()).then(arr => {
    if (!arr || !arr.length) {
      el.innerHTML = '<div class="cart-empty" style="padding:60px 0"><div class="cart-empty-icon">📝</div><div class="cart-empty-title">Belum Ada Artikel</div><div class="cart-empty-sub">Artikel & tips seputar plastik OPP akan segera hadir. Sambil menunggu, yuk lihat koleksi produk kami.</div><a class="btn-red" href="/shop">🛒 Lihat Produk</a></div>';
      return;
    }
    el.innerHTML = `<div class="a-grid">${arr.map(a => `
      <a class="a-card" href="/artikel/${encodeURIComponent(a.slug)}">
        ${a.image ? `<div class="a-thumb"><img src="${a.image.replace(/^https:\/\/pub-[a-f0-9]+\.r2\.dev\//,'/img/')}" alt="${SP.esc(a.title)}" loading="lazy" onerror="this.parentElement.textContent='📝'"></div>` : '<div class="a-thumb">📝</div>'}
        <div class="a-body">
          <div class="a-tag">${SP.esc(a.category || 'Blog')}</div>
          <div class="a-title">${SP.esc(a.title)}</div>
          <div class="a-desc">${SP.esc(trunc(a.content, 110))}</div>
          <div class="a-meta">📅 ${fmtDate(a.created_at)} · 👁️ ${Number(a.views || 0)}x dibaca</div>
          <div class="a-read">Baca selengkapnya →</div>
        </div>
      </a>`).join('')}</div>`;
  }).catch(() => {
    el.innerHTML = '<div class="cart-empty" style="padding:60px 0"><div class="cart-empty-icon">😕</div><div class="cart-empty-title">Gagal Memuat Artikel</div><div class="cart-empty-sub">Coba muat ulang halaman ini, atau hubungi admin via WhatsApp.</div><a class="btn-red" href="https://wa.me/628129153811" target="_blank" rel="noopener">💬 Chat WhatsApp</a></div>';
  });
})();
</script>
