<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline — Murah Plastic</title>
<meta name="robots" content="noindex,nofollow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:linear-gradient(135deg,#6B0000 0%,#C8191A 40%,#E86510 75%,#C9890A 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:white;text-align:center;padding:24px}
.card{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.25);backdrop-filter:blur(8px);border-radius:24px;padding:48px 32px;max-width:420px;width:100%}
.logo{width:72px;height:72px;background:linear-gradient(90deg,#C9890A,#F5C842);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:#6B0000;margin:0 auto 20px}
h1{font-size:22px;font-weight:900;margin-bottom:8px}
p{font-size:14px;opacity:.85;line-height:1.6;margin-bottom:24px}
.btn{display:inline-block;background:white;color:#C8191A;text-decoration:none;font-weight:800;font-size:14px;padding:12px 28px;border-radius:14px}
.btn:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">M</div>
  <h1>Kamu Sedang Offline</h1>
  <p>Koneksi internet terputus. Periksa jaringanmu lalu coba lagi, atau kembali ke Beranda.</p>
  <a class="btn" href="/">🔄 Coba Lagi</a>
</div>
</body>
</html>
