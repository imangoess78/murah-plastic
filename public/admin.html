// ── Notifikasi admin ──
const ADMIN_NOTIF_ICONS = { order: '🛒', order_status: '📦', komplain: '🛠️', qna_answer: '❓', question: '❓', review: '⭐' };
let ADMIN_NOTIFS = [];
function toggleAdminNotif(e) {
  if (e) e.stopPropagation();
  const p = document.getElementById('adminNotifPanel');
  if (!p) return;
  p.classList.toggle('open');
  if (p.classList.contains('open')) loadAdminNotifs();
}
async function loadAdminNotifs() {
  const listEl = document.getElementById('adminNotifList');
  if (!listEl) return;
  listEl.innerHTML = '<div class="loading" style="padding:30px">⏳ Memuat...</div>';
  try {
    ADMIN_NOTIFS = await api('GET', '/api/notifications');
    if (!ADMIN_NOTIFS.length) {
      listEl.innerHTML = '<div class="empty" style="padding:34px 20px"><div class="empty-icon">🔔</div><div class="empty-text">Belum ada notifikasi</div></div>';
      return;
    }
    listEl.innerHTML = ADMIN_NOTIFS.map((n, i) => {
      const icon = ADMIN_NOTIF_ICONS[n.type] || '🔔';
      const d = new Date(n.created_at);
      const dateStr = isNaN(d) ? '' : d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }) + ' · ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      return `<div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="openAdminNotif(${i})">
        <div class="notif-item-icon">${icon}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:12.5px;font-weight:800;color:var(--dark)">${esc(n.title)}</div>
          <div style="font-size:11.5px;color:var(--mid);margin-top:2px">${esc(n.message || '')}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:4px">${dateStr}</div>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    listEl.innerHTML = '<div class="empty" style="padding:30px"><div class="empty-text">Gagal memuat notifikasi</div></div>';
  }
}
function openAdminNotif(i) {
  const n = ADMIN_NOTIFS[i];
  if (!n) return;
  if (!n.is_read) api('PUT', '/api/notifications/' + n.id + '/read').then(() => { n.is_read = 1; updateAdminNotifBadge(); });
  document.getElementById('adminNotifPanel').classList.remove('open');
  if (n.type === 'order' || n.type === 'order_status') setTab('orders');
  else if (n.type === 'komplain') setTab('komplain');
  else if (n.type === 'question' || n.type === 'qna_answer') setTab('qna');
  else setTab('dashboard');
}
async function updateAdminNotifBadge() {
  const badge = document.getElementById('adminNotifBadge');
  if (!badge) return;
  try {
    const r = await api('GET', '/api/notifications/unread-count');
    const c = (r && r.count) || 0;
    if (c > 0) { badge.textContent = c > 9 ? '9+' : c; badge.style.display = 'flex'; }
    else badge.style.display = 'none';
  } catch (e) { badge.style.display = 'none'; }
}
document.addEventListener('click', function (e) {
  const p = document.getElementById('adminNotifPanel');
  const bell = document.getElementById('adminNotifBell');
  if (p && p.classList.contains('open') && bell && !p.contains(e.target) && !bell.contains(e.target)) {
    p.classList.remove('open');
  }
});
setInterval(updateAdminNotifBadge, 30000);

// ── Init ──
// Auto-fit angka statistik — shrink font sampai muat dalam 1 baris
function fitStatValues() {
  const ctx = document.createElement('canvas').getContext('2d');
  const els = document.querySelectorAll('.stat-value');
  for (const el of els) {
    const parent = el.parentElement;
    if (!parent) continue;
    const pcs = getComputedStyle(parent);
    const avail = parent.clientWidth - (parseFloat(pcs.paddingLeft) || 0) - (parseFloat(pcs.paddingRight) || 0) - 2;
    const base = getComputedStyle(el);
    let fs = parseFloat(base.fontSize) || 24;
    const text = el.textContent || '';
    const setFont = () => ctx.font = base.font.replace(/\d+(\.\d+)?px/, fs + 'px');
    setFont();
    while (ctx.measureText(text).width > avail && fs > 10) {
      fs -= 0.5;
      setFont();
    }
    el.style.fontSize = fs + 'px';
  }
}
// Observer otomatis — shrink setiap kali konten berubah
new MutationObserver(() => requestAnimationFrame(fitStatValues))
  .observe(document.getElementById('mainContent'), { childList: true, subtree: true });

(function init() {
  if (TOKEN) {
    startPolling();
    updateAdminNotifBadge();
  } else {
    document.getElementById('loginPage').style.display = 'flex';
  }
})();
