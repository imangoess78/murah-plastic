<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard — Murah Plastic</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Panel admin Murah Plastic — kelola produk, pesanan, artikel, dan laporan.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23C8191A'/><text x='50' y='68' font-size='50' font-weight='900' fill='white' text-anchor='middle'>M</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#C8191A;--red-dark:#9E1010;--red-light:#FFF0F0;
  --gold:#C9890A;--gold-light:#FFF8E7;--gold-bright:#F5C842;
  --grad-hero:linear-gradient(135deg,#6B0000 0%,#C8191A 40%,#E86510 75%,#C9890A 100%);
  --grad-gold:linear-gradient(90deg,#C9890A 0%,#F5C842 50%,#C9890A 100%);
  --grad-btn:linear-gradient(135deg,#C8191A 0%,#E86510 100%);
  --dark:#1A0A00;--mid:#5A3A1A;--muted:#9A7A5A;
  --light:#FFFDF8;--border:rgba(201,137,10,0.15);
  --shadow:0 2px 16px rgba(201,137,10,0.10);
  --radius:16px;--radius-sm:10px;
  --font:"Plus Jakarta Sans",system-ui,sans-serif;
  --sidebar-w:250px;
}
body{font-family:var(--font);background:var(--light);color:var(--dark);min-height:100vh;display:flex}
.sidebar{width:var(--sidebar-w);background:white;border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;box-shadow:var(--shadow)}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-logo .logo-box{width:40px;height:40px;background:var(--grad-hero);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:white;flex-shrink:0}
.sidebar-logo .brand{font-size:16px;font-weight:900;color:var(--dark);line-height:1.1}
.sidebar-logo .brand span{color:var(--gold)}
.sidebar-logo .sub{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase}
.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-section{padding:8px 16px 4px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-radius:0;transition:background .15s;font-size:13px;font-weight:600;color:var(--mid);border:none;background:none;width:100%;text-align:left;margin:1px 0}
.nav-item:hover{background:var(--gold-light);color:var(--gold)}
.nav-item.active{background:var(--red-light);color:var(--red);border-left:3px solid var(--red);font-weight:800}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.nav-badge{margin-left:auto;background:var(--grad-gold);color:var(--dark);border-radius:99px;font-size:10px;font-weight:800;padding:1px 7px;min-width:18px;text-align:center}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border)}
.admin-user{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--gold-light)}
.admin-avatar{width:32px;height:32px;border-radius:50%;background:var(--grad-hero);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:white;flex-shrink:0}
.admin-info{flex:1;min-width:0}
.admin-name{font-size:12px;font-weight:800;color:var(--dark)}
.admin-role{font-size:10px;color:var(--muted);font-weight:600}
.logout-btn{background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:6px;transition:all .15s;flex-shrink:0}
.logout-btn:hover{color:var(--red);border-color:var(--red);background:var(--red-light)}
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:white;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.03);min-width:0}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.topbar-title{font-size:16px;font-weight:800;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.refresh-btn{background:var(--gold-light);border:1px solid var(--border);color:var(--gold);padding:7px 14px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700;font-family:var(--font);transition:all .15s}
.refresh-btn:hover{background:var(--gold);color:white;border-color:var(--gold)}
.status-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.content{padding:24px;flex:1}
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--grad-hero);position:fixed;inset:0;z-index:999}
.login-card{background:white;border-radius:var(--radius);padding:40px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{width:64px;height:64px;background:var(--grad-hero);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:white;margin:0 auto 16px}
.login-title{font-size:22px;font-weight:900;color:var(--dark);margin-bottom:4px}
.login-title span{color:var(--gold)}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:28px}
.login-input{width:100%;background:var(--light);border:2px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;font-size:14px;color:var(--dark);font-family:var(--font);outline:none;transition:border .15s;margin-bottom:12px}
.login-input:focus{border-color:var(--gold)}
.login-btn{width:100%;background:var(--grad-btn);color:white;border:none;border-radius:24px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:var(--font);transition:opacity .15s;margin-top:4px}
.login-btn:hover{opacity:.9}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-error{color:var(--red);font-size:12px;margin-top:10px;min-height:18px;font-weight:600}
.card{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stat-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.stat-value{font-size:clamp(14px, 1.8vw, 24px);font-weight:900;color:var(--dark);white-space:nowrap;line-height:1.3}
.stat-sub{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600}
.stat-card.gold .stat-value{color:var(--gold)}
.stat-card.green .stat-value{color:#16a34a}
.stat-card.red .stat-value{color:var(--red)}
.stat-card.blue .stat-value{color:#2563eb}
.stat-card.orange .stat-value{color:#ea580c}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{background:white;border:1px solid var(--border);color:var(--mid);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .15s}
.filter-btn:hover{background:var(--gold-light);border-color:var(--gold);color:var(--gold)}
.filter-btn.active{background:var(--grad-btn);color:white;border-color:var(--red)}
.table-wrap{background:white;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;box-shadow:var(--shadow)}
.table-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.table-title{font-size:14px;font-weight:800;color:var(--dark)}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--gold-light)}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:800;color:var(--mid);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
td{padding:10px 16px;font-size:13px;color:var(--dark);border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(201,137,10,.04)}
.order-id{font-weight:800;font-family:monospace;font-size:12px;color:var(--red)!important}
.status-badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800}
.s-waiting{background:var(--gold-light);color:var(--gold)}
.s-processing{background:#EFF6FF;color:#2563eb}
.s-shipped{background:#F0FDF4;color:#16a34a}
.s-done{background:#F8FAFC;color:#64748b}
.s-cancel{background:var(--red-light);color:var(--red)}
.action-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.action-btn{background:var(--light);border:1px solid var(--border);color:var(--mid);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;font-family:var(--font);transition:all .15s;white-space:nowrap}
.action-btn:hover{background:var(--gold-light);border-color:var(--gold);color:var(--gold)}
.action-btn.wa{background:#F0FDF4;border-color:#22c55e;color:#16a34a}
.action-btn.wa:hover{background:#22c55e;color:white}
.action-btn.del{background:var(--red-light);border-color:var(--red);color:var(--red)}
.action-btn.del:hover{background:var(--red);color:white}
.action-btn.primary{background:var(--grad-btn);border:none;color:white}
.action-btn.primary:hover{opacity:.9}
.status-select{background:white;border:2px solid var(--border);color:var(--dark);padding:4px 8px;border-radius:8px;font-size:12px;font-family:var(--font);cursor:pointer;font-weight:600;outline:none}
.status-select:focus{border-color:var(--gold)}
.search-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.search-input{flex:1;background:white;border:2px solid var(--border);border-radius:var(--radius-sm);padding:9px 14px;font-size:13px;font-family:var(--font);color:var(--dark);outline:none;transition:border .15s;max-width:320px}
.search-input:focus{border-color:var(--gold)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:var(--radius);width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);padding:24px}
.modal h2{font-size:18px;font-weight:900;color:var(--dark);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal-close{float:right;background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);padding:0 4px}
.modal label{display:block;font-size:12px;font-weight:700;color:var(--mid);margin-bottom:4px;margin-top:12px}
.modal input,.modal select,.modal textarea{width:100%;background:var(--light);border:2px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;font-family:var(--font);color:var(--dark);outline:none;transition:border .15s}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--gold)}
.modal textarea{min-height:100px;resize:vertical}
.modal .form-row{display:flex;gap:12px;flex-wrap:wrap}
.modal .form-row>*{flex:1;min-width:120px}
.modal .btn-row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.modal .btn-row .btn{background:var(--light);border:1px solid var(--border);color:var(--mid);padding:9px 20px;border-radius:24px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .15s}
.modal .btn-row .btn:hover{background:var(--border)}
.modal .btn-row .btn.primary{background:var(--grad-btn);border:none;color:white}
.modal .btn-row .btn.primary:hover{opacity:.9}

/* ── Detail-order modern buttons ── */
.d-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;font-family:var(--font);cursor:pointer;border:1.5px solid var(--border);background:white;color:var(--mid);transition:all .2s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 3px rgba(0,0,0,.04);text-decoration:none;line-height:1.2;white-space:nowrap}
.d-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08);border-color:var(--gold);color:var(--gold)}
.d-btn:active{transform:translateY(0)}
.d-btn-primary{background:var(--grad-btn);border:none;color:white;box-shadow:0 2px 8px rgba(200,25,26,.25)}
.d-btn-primary:hover{box-shadow:0 4px 16px rgba(200,25,26,.35);color:white;border:none}
.d-btn-success{background:linear-gradient(135deg,#16a34a 0%,#22c55e 100%);border:none;color:white;box-shadow:0 2px 8px rgba(22,163,74,.25)}
.d-btn-success:hover{box-shadow:0 4px 16px rgba(22,163,74,.35);color:white;border:none}
.d-btn-danger{background:white;border:1.5px solid #dc2626;color:#dc2626}
.d-btn-danger:hover{background:#dc2626;color:white;border-color:#dc2626;box-shadow:0 4px 12px rgba(220,38,38,.2)}
.d-btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--mid)}
.d-btn-outline:hover{background:var(--gold-light);border-color:var(--gold);color:var(--gold);box-shadow:0 4px 12px rgba(201,137,10,.12)}
.d-btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.d-btn-block{width:100%}
.chart-bar{display:flex;align-items:flex-end;gap:8px;height:120px;padding:10px 0;justify-content:space-around}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.chart-col .bar{width:100%;max-width:40px;border-radius:4px 4px 0 0;background:var(--grad-gold);transition:height .3s;min-height:4px}
.chart-col .bar-label{font-size:9px;color:var(--muted);font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chart-col .bar-val{font-size:9px;color:var(--dark);font-weight:800;text-align:center}
.qna-list{display:flex;flex-direction:column;gap:12px}
.qna-card{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.qna-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.qna-user{font-weight:800;color:var(--dark);font-size:13px}
.qna-product{background:var(--gold-light);color:var(--gold);padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.qna-date{font-size:11px;color:var(--muted);margin-left:auto}
.qna-q{font-size:13px;color:var(--mid);margin-bottom:10px;padding:8px 12px;background:var(--light);border-radius:8px;border-left:3px solid var(--gold)}
.qna-answer{display:flex;gap:8px}
.qna-answer textarea{flex:1;background:var(--light);border:2px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--dark);font-family:var(--font);resize:vertical;min-height:60px;outline:none}
.qna-answer textarea:focus{border-color:var(--gold)}
.qna-answer-btn{background:var(--grad-btn);border:none;color:white;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;font-family:var(--font);white-space:nowrap;align-self:flex-start;margin-top:2px}
.qna-del{background:none;border:none;cursor:pointer;font-size:14px;padding:2px;opacity:.6;transition:opacity .15s;margin-left:auto}
.qna-del:hover{opacity:1}
.answered-badge{background:#F0FDF4;color:#16a34a;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
.answered-text{font-size:12px;color:#16a34a;padding:8px 12px;background:#F0FDF4;border-radius:8px;border-left:3px solid #16a34a;margin-top:6px}
.komplain-card{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.komplain-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.komplain-id{font-family:monospace;font-size:12px;font-weight:800;color:var(--red)}
.komplain-customer{font-size:13px;color:var(--mid)}
.komplain-status-select{background:white;border:2px solid var(--border);color:var(--dark);padding:5px 10px;border-radius:8px;font-size:12px;font-family:var(--font);font-weight:600;outline:none}
.komplain-detail{font-size:12px;color:var(--mid);margin-bottom:8px;line-height:1.5}
.komplain-proof img{max-width:180px;border-radius:8px;border:1px solid var(--border);margin-top:6px}
.toast-container{position:fixed;top:80px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:white;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;font-weight:700;color:var(--dark);box-shadow:0 8px 24px rgba(0,0,0,.12);animation:slideIn .3s ease;pointer-events:auto;display:flex;align-items:center;gap:8px;max-width:360px}
.toast.success{border-left:4px solid #16a34a}
.toast.error{border-left:4px solid var(--red)}
.toast.info{border-left:4px solid var(--gold)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:8px}
.empty-text{font-size:14px;font-weight:700}
.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;font-weight:600}
.mobile-menu-btn{display:none;background:none;border:none;color:var(--dark);font-size:22px;cursor:pointer;padding:4px;margin-right:0;flex-shrink:0}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
.notif-bell{position:relative;background:#fff;border:1px solid var(--border);border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color .15s}
.notif-bell:hover{border-color:var(--gold)}
.notif-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:10px;min-width:16px;height:16px;padding:0 4px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.notif-dropdown{position:fixed;top:56px;right:16px;width:370px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.18);z-index:1000;display:none;overflow:hidden}
.notif-dropdown.open{display:block}
.notif-dropdown-head{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:800;color:var(--dark);background:var(--light)}
.notif-dropdown-head button{background:none;border:none;cursor:pointer;font-size:14px;color:var(--muted);font-weight:800}
.notif-dropdown-list{max-height:400px;overflow-y:auto}
.notif-item{display:flex;gap:10px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
.notif-item:hover{background:var(--light)}
.notif-item.unread{background:var(--gold-light)}
.notif-item-icon{font-size:20px;flex-shrink:0;margin-top:1px}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .main{margin-left:0;min-width:0}
  .mobile-menu-btn{display:block}
  .topbar{flex-direction:row;flex-wrap:nowrap;gap:10px;padding:12px 16px;font-size:14px}
  .topbar-left{flex:1;min-width:0}
  .topbar-right{flex-wrap:nowrap;justify-content:flex-end;margin-left:auto}
  .od-grid > div{min-width:0}
  .od-grid .card table{display:block;overflow-x:auto;white-space:nowrap}
  .od-grid .card input{width:100%;min-width:0;box-sizing:border-box}
  th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){display:none}
  th:nth-child(3),td:nth-child(3){display:none}
  .content{padding:12px;min-width:0}
  .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat-card{min-width:0;padding:14px 16px}
  .stat-value{font-size:clamp(13px, 3.5vw, 18px)}
  .stat-label{font-size:10px}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table-wrap table{min-width:560px}
  .qna-grid,.report-grid,.settings-grid,.dashboard-grid,.od-grid{grid-template-columns:1fr!important}
  .card{padding:14px}
  .modal-inner{max-width:calc(100vw - 24px);max-height:85vh;overflow-y:auto}
  .form-row{flex-direction:column}

<div class="toast-container" id="toastContainer"></div>

<script>

// ── Icon helper: returns inline SVG <use> referencing the sprite ──
window.IC = (n) => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
var IC = window.IC;

'use strict';
let TOKEN = localStorage.getItem('mp_admin_token') || '';
let ADMIN_ROLE = localStorage.getItem('mp_admin_role') || 'super_admin';
let ADMIN_NAME = localStorage.getItem('mp_admin_name') || 'Super Admin';
const ROLE_LABELS = { super_admin:'' + IC("crown") + ' Super Admin', finance:'' + IC("dollar-sign") + ' Keuangan', operations:'' + IC("package") + ' Operasional', cs:'' + IC("headphones") + ' Customer Service', warehouse:'' + IC("truck") + ' Gudang' };
const ROLE_TABS = {
  super_admin: ['dashboard','orders','products','categories','customers','komplain','qna','articles','reports','payment','users','settings'],
  finance: ['dashboard','orders','payment','reports','customers'],
  operations: ['dashboard','orders','products','categories','komplain','qna','articles'],
  cs: ['dashboard','orders','komplain','qna','customers'],
  warehouse: ['dashboard','orders']
};
let TAB_TITLES_EXTRA = { payment:'' + IC("credit-card") + ' Pembayaran', users:'' + IC("briefcase") + ' Pengguna' };
let currentTab = 'dashboard';
let pollInterval = null;
let ORDERS = [], PRODUCTS = [], QUESTIONS = [], ARTICLES = [], CUSTOMERS = [], STATS = null;
let CATEGORIES = [];
let orderFilter = 'Semua';
let orderMatch = '';
let productSearch = '', customerSearch = '', articleSearch = '';
let detailOrderId = null;
let detailSig = '';
let debounceTimer = null;
let PM_CACHE = [];   // payment methods dari /api/payment-methods/all (id → label)
let SETTINGS = {};   // settings toko (diskon, gratis ongkir) dari /api/settings

// Default jika settings belum ter-load
const SETTINGS_DEFAULTS = {
  member_discount: '10',
  free_ship_min: '500000',
  discount_tiers: JSON.stringify([{min:100,pct:20},{min:50,pct:10},{min:10,pct:5},{min:5,pct:2}])
};
const getSetting = (k) => (SETTINGS[k] !== undefined && SETTINGS[k] !== null && SETTINGS[k] !== '') ? SETTINGS[k] : (SETTINGS_DEFAULTS[k] || '');

// Konversi payment method: kalau nilai adalah ID (cth PM-xxx), tampilkan label-nya.
// Nilai lama ("Transfer Bank", "COD", dll) tetap ditampilkan apa adanya.
function pmLabel(v) {
  if (!v) return '-';
  const hit = PM_CACHE.find(m => m.id === v);
  return hit ? (hit.label || v) : v;
}

const fmt = n => 'Rp' + Math.round(n).toLocaleString('id-ID');
const td = d => { const dt = new Date(d); return isNaN(dt) ? (d||'-') : dt.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); };
const STATUSES = ['Semua','Menunggu Pembayaran','Menunggu Konfirmasi','Diproses','Dikirim','Selesai','Dibatalkan'];
const STATUS_CLASS = {'Menunggu Pembayaran':'s-waiting','Menunggu Konfirmasi':'s-waiting','Diproses':'s-processing','Dikirim':'s-shipped','Selesai':'s-done','Dibatalkan':'s-cancel'};
// Parse JSON aman: API sudah meng-parse items/shipping/complaint jadi object/array,
// tapi sebagian alur lama menyimpannya sebagai string — pj() menangani keduanya.
const pj = (v, fb) => { if (v == null) return fb; if (typeof v !== 'string') return v; try { return JSON.parse(v); } catch (e) { return fb; } };
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  const icons = {success:'' + IC("check-circle-2") + '',error:'' + IC("x-circle") + '',info:'' + IC("info") + ''};
  el.innerHTML = '<span>'+(icons[type||'info']||'' + IC("info") + '')+'</span> ' + msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => { el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3000);
}

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
  if (res.status === 401) {
    TOKEN = null; localStorage.removeItem('mp_admin_token');
    clearInterval(pollInterval);
    document.getElementById('loginPage').style.display = 'flex';
    throw new Error('Sesi berakhir, silakan login ulang');
  }
  if (!res.ok) throw new Error((data && data.error) ? data.error : ('HTTP ' + res.status));
  return data;
}

// ── Auth ──
function togglePass() {
  const el = document.getElementById('loginPass');
  const btn = document.getElementById('eyeBtn');
  if (el.type === 'password') { el.type = 'text'; btn.textContent = '🙈'; }
  else { el.type = 'password'; btn.textContent = '👁️'; }
}
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.textContent = '';
  if (!email) { errEl.textContent = 'Email wajib diisi.'; return; }
  if (!pass) { errEl.textContent = 'Password wajib diisi.'; return; }
  btn.disabled = true; btn.textContent = '⏳ Memproses...';
  try {
    const r = await api('POST', '/api/admin/login', { email, password: pass });
    TOKEN = r.token;
    ADMIN_ROLE = r.role || 'super_admin';
    ADMIN_NAME = r.name || 'Super Admin';
    localStorage.setItem('mp_admin_token', r.token);
    localStorage.setItem('mp_admin_role', ADMIN_ROLE);
    localStorage.setItem('mp_admin_name', ADMIN_NAME);
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('loginPass').value = '';
    document.getElementById('topbarTitle').textContent = (TAB_TITLES[currentTab] || currentTab) + (ADMIN_ROLE !== 'super_admin' ? ' · ' + (ROLE_LABELS[ADMIN_ROLE] || ADMIN_ROLE) : '');
    applyRoleTabs();
    toast('Login berhasil! ' + (ROLE_LABELS[ADMIN_ROLE] || ADMIN_ROLE), 'success');
    startPolling();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Masuk →';
    errEl.textContent = e.message.includes('Unauthorized') ? 'Email atau password salah.' : 'Gagal login: ' + e.message;
  }
}

function applyRoleTabs() {
  const allowed = ROLE_TABS[ADMIN_ROLE] || ROLE_TABS.super_admin;
  document.querySelectorAll('.nav-item').forEach(el => {
    const tab = el.id.replace('nav-', '');
    const hide = !allowed.includes(tab);
    el.style.display = hide ? 'none' : '';
  });
  if (!allowed.includes(currentTab)) { currentTab = 'dashboard'; setTab('dashboard'); }
}

function doLogout() {
  if (!confirm('Yakin mau logout?')) return;
  api('POST', '/api/admin/logout').catch(() => {});
  TOKEN = null; ADMIN_ROLE = 'super_admin'; ADMIN_NAME = '';
  localStorage.removeItem('mp_admin_token');
  localStorage.removeItem('mp_admin_role');
  localStorage.removeItem('mp_admin_name');
  clearInterval(pollInterval);
  document.getElementById('loginPage').style.display = 'flex';
  toast('Anda telah logout', 'info');
}

// ── Data fetch ──
async function fetchAll() {
  if (!TOKEN) return;
  try {
    const [o, p, q, a, c, st, pms, s] = await Promise.allSettled([
      api('GET', '/api/orders'),
      api('GET', '/api/products'),
      api('GET', '/api/questions'),
      api('GET', '/api/articles?all=1'),
      api('GET', '/api/customers'),
      api('GET', '/api/stats'),
      api('GET', '/api/payment-methods/all'),
      api('GET', '/api/settings')
    ]);
    const ok = x => x.status === 'fulfilled' ? x.value : null;
    const ORDERS_NEW = ok(o), PRODUCTS_NEW = ok(p), QUESTIONS_NEW = ok(q), ARTICLES_NEW = ok(a);
    const CUSTOMERS_NEW = ok(c), STATS_NEW = ok(st);
    if (ORDERS_NEW) ORDERS = ORDERS_NEW;
    if (PRODUCTS_NEW) PRODUCTS = PRODUCTS_NEW;
    if (QUESTIONS_NEW) QUESTIONS = QUESTIONS_NEW;
    if (ARTICLES_NEW) ARTICLES = ARTICLES_NEW;
    if (CUSTOMERS_NEW) CUSTOMERS = CUSTOMERS_NEW;
    if (STATS_NEW) STATS = STATS_NEW;
    if (ok(pms)) PM_CACHE = ok(pms) || [];
    if (ok(s)) SETTINGS = ok(s) || {};
    const failed = [o, p, q, a, c, st].filter(x => x.status === 'rejected').length;
    if (failed === 6) {
      const firstRej = [o, p, q, a, c, st].find(x => x.status === 'rejected');
      const msg = firstRej && firstRej.reason ? firstRej.reason.message : 'unknown';
      if (!String(msg).includes('Sesi berakhir')) toast('Gagal memuat data: ' + msg, 'error');
    }
    CATEGORIES = [...new Set((PRODUCTS||[]).map(p => (p.category||'').trim()).filter(Boolean))].sort();
    updateBadges();
    renderTab();
  } catch (e) {
    if (!String(e && e.message || e).includes('Sesi berakhir')) toast('Gagal memuat data: ' + (e && e.message || e), 'error');
  }
}

function startPolling() {
  fetchAll();
  clearInterval(pollInterval);
  pollInterval = setInterval(fetchAll, 15000);
}

function updateBadges() {
  const pending = ORDERS.filter(o => o.status === 'Menunggu Pembayaran').length;
  const unanswered = QUESTIONS.filter(q => !q.answer).length;
  const komplain = ORDERS.filter(o => o.complaint && (pj(o.complaint,{}).status || 'Menunggu Diproses') !== 'Selesai').length;
  const b = (id, n) => { const el = document.getElementById(id); if (el) { el.textContent = n; el.style.display = n ? '' : 'none'; } };
  b('badge-orders', pending); b('badge-qna', unanswered); b('badge-komplain', komplain);
}

// ── Tabs ──
const TAB_TITLES = {
  dashboard:'' + IC("layout-dashboard") + ' Dashboard', orders:'' + IC("package") + ' Pesanan', products:'' + IC("shopping-bag") + '️ Produk', categories:'' + IC("folder") + ' Kategori', customers:'' + IC("users") + ' Pelanggan',
  komplain:'' + IC("wrench") + '️ Komplain', qna:'' + IC("message-circle") + ' Tanya Jawab', articles:'' + IC("file-text") + ' Blog/Artikel', reports:'' + IC("trending-up") + ' Laporan', settings:'' + IC("settings") + ' Pengaturan',
  payment:'' + IC("credit-card") + ' Pembayaran', users:'' + IC("briefcase") + ' Pengguna'
};

function setTab(tab) {
  // Keluar dari mode detail pesanan saat navigasi (nav sidebar, notifikasi, dsb)
  detailOrderId = null;
  detailSig = '';
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + tab);
  if (navEl) navEl.classList.add('active');
  document.getElementById('topbarTitle').textContent = (TAB_TITLES[tab] || tab) + (ADMIN_ROLE !== 'super_admin' ? ' · ' + (ROLE_LABELS[ADMIN_ROLE] || ADMIN_ROLE) : '');
  closeSidebar();
  renderTab();
}

function renderTab() {
  const c = document.getElementById('mainContent');
  if (detailOrderId) {
    const o = ORDERS.find(x => x.id === detailOrderId);
    if (!o) { detailOrderId = null; }
    else {
      const sig = o.id + '|' + o.status + '|' + (o.resi || '') + '|' + (pj(o.timeline, []) || []).length;
      if (sig !== detailSig) { detailSig = sig; renderOrderDetail(c, o); }
      return;
    }
  }
  if (currentTab === 'dashboard') renderDashboard(c);
  else if (currentTab === 'orders') renderOrders(c);
  else if (currentTab === 'products') renderProducts(c);
  else if (currentTab === 'categories') renderCategories(c);
  else if (currentTab === 'customers') renderCustomers(c);
  else if (currentTab === 'komplain') renderKomplain(c);
  else if (currentTab === 'payment') renderPembayaran(c);
  else if (currentTab === 'users') renderPengguna(c);
  else if (currentTab === 'qna') renderQna(c);
  else if (currentTab === 'articles') renderArticles(c);
  else if (currentTab === 'reports') renderReports(c);
  else if (currentTab === 'settings') renderSettings(c);
}

// ── Dashboard ──
function renderDashboard(c) {
  const s = STATS || { revenue:0, ordersCount:ORDERS.length, todayCount:0, pending:0, cancelled:0, productCount:PRODUCTS.length, unanswered:0, komplainOpen:0, komplainTotal:0, customerCount:0, reviewCount:0, monthRevenue:0, monthOrders:0, days:[], topProducts:[], byStatus:{} };
  const days = s.days && s.days.length ? s.days : [];
  const maxRev = Math.max(1, ...days.map(d => d.revenue));
  const maxOrd = Math.max(1, ...days.map(d => d.orders));
  const recent = ORDERS.slice(0, 5);
  const unans = QUESTIONS.filter(q => !q.answer).slice(0, 3);

  c.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card gold"><div class="stat-label">Total Omzet</div><div class="stat-value">${fmt(s.revenue)}</div><div class="stat-sub">${s.ordersCount} pesanan</div></div>
      <div class="stat-card blue"><div class="stat-label">Omzet Bulan Ini</div><div class="stat-value">${fmt(s.monthRevenue)}</div><div class="stat-sub">${s.monthOrders} pesanan</div></div>
      <div class="stat-card red"><div class="stat-label">Order Hari Ini</div><div class="stat-value">${s.todayCount}</div></div>
      <div class="stat-card orange"><div class="stat-label">Menunggu</div><div class="stat-value">${s.pending}</div><div class="stat-sub">${s.cancelled||0} dibatalkan</div></div>

// ── Revenue Chart (SVG area chart, modern & responsif) ──
function renderRevenueChart(days, maxRev) {
  const W = 800, H = 210, pad = { t: 14, r: 10, b: 26, l: 46 };
  const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
  const n = days.length;
  const step = cw / (n - 1);
  const pts = days.map((d, i) => ({
    x: pad.l + i * step,
    y: pad.t + ch - (maxRev > 0 ? (d.revenue / maxRev) * ch : 0),
    rev: d.revenue, orders: d.orders, date: d.date
  }));
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const area = line + ' L' + pts[n - 1].x.toFixed(1) + ',' + (pad.t + ch) + ' L' + pts[0].x.toFixed(1) + ',' + (pad.t + ch) + ' Z';
  const yTicks = [0, 0.25, 0.5, 0.75, 1].map(p => ({ y: pad.t + ch - p * ch, v: Math.round(maxRev * p) }));
  const fmtRp = v => v >= 1000000 ? (v / 1000000).toFixed(1) + 'jt' : v >= 1000 ? (v / 1000).toFixed(0) + 'k' : String(v);
  const labelEvery = Math.max(1, Math.ceil(n / 7));
  const xLabels = pts.filter((p, i) => i % labelEvery === 0 || i === n - 1);
  const maxIdx = pts.reduce((mi, p, i) => p.rev > pts[mi].rev ? i : mi, 0);
  const gradId = 'revGrad' + Math.floor(Math.random() * 10000);
  return `
  <div style="position:relative;width:100%">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.02"/>
        </linearGradient>
      </defs>
      ${yTicks.map(t => `<line x1="${pad.l}" y1="${t.y.toFixed(1)}" x2="${pad.l + cw}" y2="${t.y.toFixed(1)}" stroke="#eef0f3" stroke-width="1" stroke-dasharray="4,4"/>`).join('')}
      ${yTicks.map(t => `<text x="${pad.l - 6}" y="${(t.y + 3.5).toFixed(1)}" text-anchor="end" fill="#9ca3af" font-size="9.5" font-weight="600">${fmtRp(t.v)}</text>`).join('')}
      <path d="${area}" fill="url(#${gradId})"/>
      <path d="${line}" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map((p, i) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${i === maxIdx ? 5 : 3.5}" fill="${i === maxIdx ? '#f59e0b' : '#ffffff'}" stroke="#f59e0b" stroke-width="${i === maxIdx ? 2.5 : 2}" style="cursor:pointer" onmouseover="showRevTooltip(this,${p.rev},${p.orders},'${p.date}')" onmouseout="hideRevTooltip()"/>`).join('')}
      ${xLabels.map(p => `<text x="${p.x.toFixed(1)}" y="${pad.t + ch + 15}" text-anchor="middle" fill="#9ca3af" font-size="9" font-weight="600">${p.date.slice(8)}/${p.date.slice(5, 7)}</text>`).join('')}
    </svg>
    <div id="revTip" style="display:none;position:absolute;top:0;left:0;background:#111827;color:#fff;padding:9px 13px;border-radius:10px;font-size:12px;font-weight:700;line-height:1.5;pointer-events:none;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:100;border:1px solid rgba(255,255,255,.12)"></div>
  </div>`;
}
function showRevTooltip(circle, rev, orders, date) {
  const tip = document.getElementById('revTip');
  if (!tip) return;
  const svg = circle.ownerSVGElement, wrap = svg.parentElement;
  const r = svg.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
  const scale = r.width / svg.viewBox.baseVal.width;
  const cx = circle.cx.baseVal.value * scale, cy = circle.cy.baseVal.value * scale;
  const x = cx - wr.left, y = cy - wr.top;
  const d = new Date(date + 'T00:00:00');
  const dname = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][d.getDay()];
  tip.innerHTML = '<div style="font-size:10px;color:#fbbf24;text-transform:uppercase;letter-spacing:.5px">' + dname + ' · ' + date.slice(8) + '/' + date.slice(5, 7) + '</div>' +
    '<div>' + IC("dollar-sign") + ' Rp' + Number(rev).toLocaleString('id-ID') + '</div>' +
    '<div style="font-size:11px;color:#9ca3af;font-weight:600">' + IC("package") + ' ' + orders + ' pesanan</div>';
  tip.style.display = 'block';
  tip.style.left = Math.max(8, Math.min(wr.width - 8, x)) + 'px';
  tip.style.top = Math.max(4, y - 14) + 'px';
  tip.style.transform = 'translate(-50%,-100%)';
}
function hideRevTooltip() {
  const tip = document.getElementById('revTip');
  if (tip) tip.style.display = 'none';
}

function setOrderFilter(f) { orderFilter = f; renderTab(); }

function debounce(fn, ms) { clearTimeout(debounceTimer); debounceTimer = setTimeout(fn, ms); }

function updateStatus(id, status, sel) {
  api('PUT', '/api/orders/' + id, { status })
    .then(() => { const o = ORDERS.find(x => x.id === id); if (o) o.status = status; updateBadges(); toast('Status diubah: ' + status, 'success'); })
    .catch(e => { toast('Gagal update: ' + e.message, 'error'); sel.value = (ORDERS.find(x => x.id === id) || {}).status || ''; });
}

function showResi(id, current) {
  const resi = prompt('Masukkan nomor resi:', current || '');
  if (resi === null) return;
  api('PUT', '/api/orders/' + id, { resi })
    .then(() => { const o = ORDERS.find(x => x.id === id); if (o) o.resi = resi; toast('' + IC("check-circle-2") + ' Resi tersimpan', 'success'); })
    .catch(e => toast('Gagal: ' + e.message, 'error'));
}

function deleteOrder(id) {
  if (!confirm('Hapus pesanan ' + id + '? Tidak bisa di-undo.')) return;
  api('DELETE', '/api/orders/' + id)
    .then(() => { ORDERS = ORDERS.filter(o => o.id !== id); renderTab(); toast('Pesanan dihapus', 'success'); })
    .catch(e => toast('Gagal hapus: ' + e.message, 'error'));
}

              <span class="status-badge ${STATUS_CLASS[t.status]||'s-done'}" style="white-space:nowrap">${esc(t.status||'')}</span>
              <span style="color:var(--muted);flex:1">${esc(t.note||'')}</span>
              <span style="color:var(--muted);font-size:11px;white-space:nowrap">${td(t.at)}</span>
            </div>`).join('')}
        </div>` : ''; })()}
        <div class="btn-row" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
          <button class="d-btn d-btn-outline" onclick="closeOrderDetail()">${IC("arrow-left")} Kembali ke Pesanan</button>
          <button class="d-btn d-btn-outline" onclick="printLabel('${esc(o.id)}')">${IC("printer")}️ Print Label</button>
          <a class="d-btn d-btn-primary" href="https://wa.me/${phone}?text=${encodeURIComponent('Halo '+o.customer_name+', ini detail pesanan '+o.id)}" target="_blank">💬 Chat WA</a>
        </div>
      </div>
    </div>
  `;
}

// ── Simpan status/resi dari modal detail pesanan ──
function saveOrderStatus(id) {
  const o = ORDERS.find(x => x.id === id);
  if (!o) return;
  const status = document.getElementById('od-status').value;
  const resi = document.getElementById('od-resi').value.trim();
  const note = document.getElementById('od-note').value.trim();
  const body = {};
  if (status !== o.status) body.status = status;
  if (resi !== (o.resi || '')) body.resi = resi;
  if (!body.status && !body.resi) { toast('Tidak ada perubahan', 'info'); return; }
  if (note) body.note = note;
  api('PUT', '/api/orders/' + id, body)
    .then(() => {
      if (body.status) o.status = body.status;
      if (body.resi !== undefined) o.resi = body.resi;
      if (body.note) { const tl = pj(o.timeline, []); tl.push({ status: body.status || o.status, note: body.note, at: new Date().toISOString() }); o.timeline = tl; }
      renderTab(); toast('Status pesanan diperbarui ' + IC("check-circle-2") + '', 'success');
    })
    .catch(e => toast('Gagal: ' + e.message, 'error'));
}

// ── Verifikasi bukti pembayaran dari modal detail pesanan ──
async function verifyPayment(orderId, decision) {
  try {
    const list = await api('GET', '/api/payment-confirmations');
    const pc = (list || []).find(c => c.order_id === orderId);
    if (!pc) { toast('Data bukti bayar tidak ditemukan', 'error'); return; }
    await api('PUT', '/api/payment-confirmations/' + pc.id, { status: decision });
    toast(decision === 'Terverifikasi' ? '' + IC("check-circle-2") + ' Pembayaran diterima, pesanan diproses' : '' + IC("x-circle") + ' Pembayaran ditolak', 'success');
    fetchAll();
  } catch (e) { toast('Gagal verifikasi: ' + e.message, 'error'); }
}

// ── Render detail komplain (field asli dari customer: type/desc/refundAmount/photos) ──
function komplainDetailHTML(cobj, o) {
  const phone = (o.customer_phone || '').replace(/[^0-9]/g, '').replace(/^0/, '62');
  const photos = cobj.photos || {};
  const photoList = Object.entries(photos).filter(([, v]) => v);
  const hist = Array.isArray(cobj.history) ? cobj.history : [];
  return `
    <div style="margin-top:10px;padding:12px;background:var(--red-light);border-radius:8px;font-size:12px;border-left:3px solid var(--red)">
      <div style="font-weight:800;margin-bottom:6px">${IC("wrench")}️ Komplain ${esc(cobj.status || '')} <span class="status-badge ${cobj.status === 'Selesai' ? 's-done' : cobj.status === 'Ditolak' ? 's-cancel' : 's-processing'}">${esc(cobj.status || 'Menunggu Diproses')}</span></div>
      <b>Jenis:</b> ${esc(cobj.type || cobj.reason || '-')}<br>
      <b>Deskripsi:</b> ${esc(cobj.desc || cobj.description || '-')}<br>
      ${cobj.itemsDesc ? `<b>Produk bermasalah:</b> ${esc(cobj.itemsDesc)}<br>` : ''}
      ${cobj.refundAmount ? `<b>Refund:</b> <span style="color:var(--red);font-weight:800">${fmt(cobj.refundAmount)}</span><br>` : ''}
      ${cobj.receivedDate ? `<b>Diterima:</b> ${esc(cobj.receivedDate)}<br>` : ''}
      ${cobj.videoFileName ? `<b>${IC("video")} Video:</b> ${esc(cobj.videoFileName)} (kirim via WA)<br>` : ''}
      ${photoList.length ? `<b>${IC("camera")} Foto:</b><br>${photoList.map(([k, v]) => `<a href="${esc(v)}" target="_blank"><img src="${esc(v)}" alt="${esc(k)}" style="max-width:90px;border-radius:6px;border:1px solid var(--border);margin:3px"></a>`).join('')}<br>` : ''}
      ${cobj.reply ? `<div style="margin-top:8px;padding:8px;background:white;border-radius:6px"><b>${IC("message-circle")} Balasan admin:</b> ${esc(cobj.reply)}</div>` : ''}
      ${hist.length ? `<div style="margin-top:6px;font-size:11px;color:var(--muted)"><b>Riwayat:</b> ${hist.map(h => `${h.from || 'Baru'} ${IC("arrow-right")} ${h.to} (${td(h.at)})`).join(' · ')}</div>` : ''}
      ${phone ? `<a class="action-btn wa" style="display:inline-block;margin-top:8px" href="https://wa.me/${phone}?text=${encodeURIComponent('Halo '+o.customer_name+', terkait komplain order '+o.id)}" target="_blank">💬 Hubungi Customer</a>` : ''}
    </div>`;
}

function shpInfo(o) {
  try {
    const s = pj(o.shipping, {});
    if (!s.city) return '';
    return '' + IC("truck") + ' ' + (s.courier_name||s.courier||'-') + ' ' + IC("arrow-right") + ' ' + s.city + (s.province ? ', ' + s.province : '') + (s.etd ? ' (' + s.etd + ' hari)' : '');
  } catch(e) { return ''; }
}

function openOrderModal() {
  openModal(`
    <button class="modal-close" onclick="closeModal()">${IC("x")}</button>
    <h2>${IC("plus")} Pesanan Baru</h2>
    <label>Nama Pelanggan</label><input id="om-name" placeholder="Nama lengkap">
    <label>No. HP</label><input id="om-phone" placeholder="08xxxxxxxxxx">
    <label>Alamat</label><textarea id="om-address" placeholder="Alamat lengkap"></textarea>
    <label>Catatan</label><input id="om-note" placeholder="Catatan (opsional)">
    <label>Total (Rp)</label><input id="om-total" type="number" placeholder="Contoh: 50000">
    <label>Metode Pembayaran</label>
    <select id="om-payment"><option>Transfer Bank</option><option>COD</option><option>QRIS</option><option>ShopeePay</option><option>GoPay</option><option>OVO</option><option>DANA</option></select>
    <label>Status</label>
    <select id="om-status"><option>Menunggu Pembayaran</option><option>Diproses</option><option>Dikirim</option><option>Selesai</option><option>Dibatalkan</option></select>
    <div class="btn-row">
      <button class="btn" onclick="closeModal()">Batal</button>
      <button class="btn primary" onclick="createOrder()">Simpan</button>
    </div>
  `);
}

async function createOrder() {
  const name = document.getElementById('om-name').value.trim();
  const phone = document.getElementById('om-phone').value.trim();
  const total = Number(document.getElementById('om-total').value);
  if (!name || !phone || !total) { toast('Nama, HP, dan Total wajib diisi', 'error'); return; }
  const id = 'ORD-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase();
  const payload = {
    id, date: new Date().toISOString(),
    customer: { name, phone, address: document.getElementById('om-address').value, note: document.getElementById('om-note').value },
    items: [{ productName: 'Pesanan manual', name: 'Pesanan manual', qty: 1, price: total }],
    sub: total, disc: 0, discAmt: 0, memberDisc: 0, memberAmt: 0, voucherAmt: 0,
    total, payment: document.getElementById('om-payment').value, status: document.getElementById('om-status').value
  };
  try {
    await api('POST', '/api/orders', payload);
    closeModal(); toast('Pesanan ' + id + ' dibuat ' + IC("check-circle-2") + '', 'success');
    fetchAll();
  } catch (e) { toast('Gagal: ' + e.message, 'error'); }
}

function exportOrders() {
  const rows = [['ID','Tanggal','Nama','HP','Alamat','Total','Status','Resi']];
  ORDERS.forEach(o => {
    rows.push([o.id, o.date, o.customer_name, o.customer_phone, o.customer_address, o.total, o.status, o.resi||'']);
  });
  const csv = rows.map(r => r.map(v => '"' + String(v ?? '').replace(/"/g,'""') + '"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
  a.download = 'orders-murah-plastic-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  toast('CSV diexport ' + IC("download") + '', 'success');
}

// ── Products ──
function renderProducts(c) {
  const q = productSearch.toLowerCase();
  const cats = [...new Set(PRODUCTS.map(p => p.category))].sort();
  const filtered = PRODUCTS.filter(p => !q || (p.name||'').toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q) || (p.short_name||'').toLowerCase().includes(q));

  c.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card green"><div class="stat-label">Total Produk</div><div class="stat-value">${PRODUCTS.length}</div></div>
      <div class="stat-card gold"><div class="stat-label">Kategori</div><div class="stat-value">${cats.length}</div></div>
      <div class="stat-card blue"><div class="stat-label">Total Varian</div><div class="stat-value">${PRODUCTS.reduce((s,p)=>s+(p.variants?p.variants.length:0),0)}</div></div>
    </div>

    <div class="search-bar">
      <input class="search-input" placeholder="🔍 Cari produk / kategori..." value="${esc(productSearch)}" oninput="debounce(()=>{productSearch=this.value;renderProducts(document.getElementById('mainContent'))},300)">
      <button class="action-btn primary" style="padding:8px 16px" onclick="openProductModal()">+ Produk Baru</button>
    </div>

    <div class="table-wrap">
      <div class="table-head"><div class="table-title">${filtered.length} produk</div></div>
      ${filtered.length === 0 ? '<div class="empty"><div class="empty-icon">' + IC("shopping-bag") + '️</div><div class="empty-text">Tidak ada produk ditemukan</div></div>' : `
      <table>
        <thead><tr><th>Gambar</th><th>Nama Produk</th><th>Kategori</th><th>Harga</th><th>Varian</th><th>Aksi</th></tr></thead>
        <tbody>${filtered.map(p => {
          const variants = p.variants || [];
          const stock = variants.reduce((s,v)=>s+(v.stock||0),0);
          const img = p.img || '';
          return `<tr>
            <td>${img ? `<img src="${esc(img)}" style="width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--border)" onerror="this.style.display='none'">` : '<span style="font-size:22px">' + IC("shopping-bag") + '️</span>'}</td>
            <td style="max-width:280px"><b style="font-size:12px">${esc((p.short_name||p.name||'').substring(0,80))}</b><br><span style="font-size:10px;color:var(--muted);font-family:monospace">${esc(p.id)}</span></td>
            <td><span style="background:var(--gold-light);color:var(--gold);padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700">${esc(p.category||'-')}</span></td>
            <td style="font-weight:800;white-space:nowrap">${fmt(p.min_price||0)}<br><span style="font-size:10px;color:var(--muted);font-weight:600">– ${fmt(p.max_price||0)}</span></td>
            <td><b>${variants.length}</b> <span style="font-size:10px;color:var(--muted)">varian · stok ${stock.toLocaleString('id-ID')}</span></td>
            <td><div class="action-btns">
              <button class="action-btn" onclick="openProductDetail('${esc(p.id)}')">${IC("clipboard-list")}</button>
              <button class="action-btn" onclick="openProductModal('${esc(p.id)}')">${IC("pencil")}</button>
              <button class="action-btn del" onclick="deleteProduct('${esc(p.id)}')">${IC("trash-2")}</button>
            </div></td>
          </tr>`;
        }).join('')}</tbody>
      </table>`}
    </div>
  `;
}

// ── KATEGORI (CRUD, dinamis, featured image) ──

        <input class="search-input" id="catImage" value="${esc(cat?cat.featured_image:'')}" placeholder="/img/products/img_xxx.jpeg" style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-family:monospace;font-size:11px">
        <button class="action-btn" onclick="document.getElementById('catImageUpload').click()">${IC("camera")} Upload</button>

        <label style="font-size:12px;font-weight:700;color:var(--mid)">Urutan</label>
        <input type="number" class="search-input" id="catOrder" value="${cat?cat.sort_order:0}" style="width:60px;padding:6px;border:1px solid var(--border);border-radius:8px;text-align:center">
        <label style="font-size:12px;font-weight:700;color:var(--mid);margin-left:8px">Aktif</label>
        <input type="checkbox" id="catActive" ${(!cat||cat.active)?'checked':''} style="width:18px;height:18px">
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="action-btn primary" onclick="saveCategory('${cat?cat.id:''}')" style="flex:1;padding:10px">${isEdit?'' + IC("save") + ' Simpan':'' + IC("plus") + ' Buat Kategori'}</button>

function uploadCategoryImage(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  fetch('/api/upload/product', {
    method: 'POST',
    headers: TOKEN ? { 'Authorization': 'Bearer ' + TOKEN } : {},
    body: form
  }).then(r => r.json()).then(data => {
    if (data.url) {
      document.getElementById('catImage').value = data.url;
      toast('Gambar terupload!', 'success');
    } else {
      toast('Gagal upload: ' + (data.error || 'unknown'), 'error');
    }
  }).catch(e => toast('Gagal upload: ' + e.message, 'error'));
  input.value = '';
}

async function saveCategory(id) {
  const name = document.getElementById('catName').value.trim();
  if (!name) { toast('Nama kategori wajib diisi', 'error'); return; }
  const data = {
    name,
    slug: document.getElementById('catSlug').value.trim(),
    icon: document.getElementById('catIcon').value.trim() || '📦',
    description: document.getElementById('catDesc').value.trim(),
    featured_image: document.getElementById('catImage').value.trim(),
    sort_order: parseInt(document.getElementById('catOrder').value) || 0,
    active: document.getElementById('catActive').checked
  };
  try {
    if (id) {
      await api('PUT', '/api/categories/' + id, data);
      toast('' + IC("check-circle-2") + ' Kategori berhasil diupdate', 'success');
    } else {
      await api('POST', '/api/categories', data);
      toast('' + IC("check-circle-2") + ' Kategori baru berhasil dibuat', 'success');
    }
    closeModal();
    renderCategories(document.getElementById('mainContent'));
  } catch (e) {
    toast('' + IC("x-circle") + ' ' + e.message, 'error');
  }
}

async function deleteCategory(id, name) {
  if (!confirm('Hapus kategori "' + name + '"?\nProduk dengan kategori ini tidak akan terhapus.')) return;
  try {
    await api('DELETE', '/api/categories/' + id);
    toast('' + IC("check-circle-2") + ' Kategori dihapus', 'success');
    renderCategories(document.getElementById('mainContent'));
  } catch (e) {
    toast('' + IC("x-circle") + ' ' + e.message, 'error');
  }
}

  const specs = p.specs || {};
  openModal(`
    <button class="modal-close" onclick="closeModal()">${IC("x")}</button>
    <h2>${IC("clipboard-list")} Detail Produk</h2>
    <div style="display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap">
      ${p.img ? `<img src="${esc(p.img)}" style="width:120px;height:120px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--border)" onerror="this.style.display='none'">` : ''}
      <div style="flex:1;min-width:200px">
        <div style="font-size:15px;font-weight:800">${esc(p.short_name||p.name)}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(p.category)} · ID: <span style="font-family:monospace">${esc(p.id)}</span></div>
        <div style="font-size:13px;color:var(--mid);margin-top:8px"><b>Harga:</b> ${fmt(p.min_price)} – ${fmt(p.max_price)}</div>

    ${Object.keys(specs).length ? `<div style="margin-top:12px;font-size:12px"><b>Spesifikasi:</b><br>${Object.entries(specs).map(([k,v]) => `<span style="color:var(--muted)">${esc(k)}</span>: ${esc(v)}<br>`).join('')}</div>` : ''}
    ${p.desc ? `<div style="margin-top:12px;font-size:12px;color:var(--mid);max-height:120px;overflow-y:auto">${esc(p.desc).substring(0,600)}...</div>` : ''}
    <div class="btn-row"><button class="btn" onclick="closeModal()">Tutup</button></div>

function openProductModal(id) {
  const p = id ? PRODUCTS.find(x => x.id === id) : null;
  const variants = (p && p.variants) ? p.variants : [];
  const specs = (p && p.specs) ? p.specs : {};
  const weight = specs.weight || '';
  const cat = p ? (p.category || '') : '';
  const isOther = !!cat && CATEGORIES.indexOf(cat) === -1;
  const catOpts = CATEGORIES.map(c => `<option value="${esc(c)}"${c === cat ? ' selected' : ''}>${esc(c)}</option>`).join('');
  openModal(`
    <button class="modal-close" onclick="closeModal()">${IC("x")}</button>
    <h2>${p ? '' + IC("pencil") + ' Edit Produk' : '' + IC("plus") + ' Produk Baru'}</h2>
    ${p ? `<input type="hidden" id="pm-id" value="${esc(p.id)}">` : ''}
    <label>Nama Produk</label><input id="pm-name" value="${esc(p?p.name:'')}" placeholder="Nama lengkap produk">
    <label>Nama Singkat</label><input id="pm-short" value="${esc(p?p.short_name:'')}" placeholder="Nama singkat untuk tampilan">
    <label>Kategori</label>
    <select id="pm-cat" onchange="toggleCatOther(this)">
      <option value="">— Pilih Kategori —</option>
      ${catOpts}
      <option value="__other__"${isOther ? ' selected' : ''}>Lainnya...</option>
    </select>
    <div id="pm-cat-other-wrap" style="${isOther ? 'display:block' : 'display:none'};margin-top:8px">
      <input id="pm-cat-other" value="${esc(isOther ? cat : '')}" placeholder="Ketik nama kategori baru...">
    </div>
    <label>Gambar Produk</label>
    <input type="file" id="pm-img-input" accept="image/*" style="display:none" onchange="uploadProductImg()">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">
      <img id="pm-img-preview" src="${esc(p?p.img:'')}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--border);${p&&p.img?'':'display:none'}" onerror="this.style.display='none'">
      <button type="button" class="action-btn" style="padding:8px 14px" onclick="document.getElementById('pm-img-input').click()">${IC("camera")} Pilih Gambar</button>
      <span id="pm-img-status" style="font-size:11px;color:var(--muted)"></span>
      <input type="hidden" id="pm-img" value="${esc(p?p.img:'')}">
    </div>
    <div class="form-row">
      <div><label>Harga Min (Rp)</label><input id="pm-min" type="number" value="${p?p.min_price:''}"></div>
      <div><label>Harga Max (Rp)</label><input id="pm-max" type="number" value="${p?p.max_price:''}"></div>
    </div>
    <div class="form-row">
      <div><label>Berat (gram)</label><input id="pm-weight" type="number" min="0" value="${esc(weight)}" placeholder="cth: 50"></div>
    </div>
    <label>Deskripsi</label><textarea id="pm-desc" placeholder="Deskripsi produk...">${esc(p?p.desc:'')}</textarea>
    <label>Varian</label>
    <div id="pm-variant-rows">${variants.length ? variants.map((v,i) => varRowHtml(v,i)).join('') : varRowHtml(null,0)}</div>
    <button type="button" class="action-btn" style="padding:8px 14px;margin-top:6px" onclick="addVarRow()">+ Tambah Varian</button>
    <div class="btn-row">
      <button class="btn" onclick="closeModal()">Batal</button>
      <button class="btn primary" onclick="saveProduct()">Simpan</button>
    </div>
  `);
}

function toggleCatOther(sel) {
  const wrap = document.getElementById('pm-cat-other-wrap');
  const other = document.getElementById('pm-cat-other');
  if (!wrap || !other) return;
  if (sel.value === '__other__') { wrap.style.display = 'block'; other.focus(); }
  else wrap.style.display = 'none';
}

function varRowHtml(v, i) {
  v = v || {};
  return `
    <div class="var-row" data-idx="${i}" style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center">
      <input class="var-name" placeholder="Nama varian" value="${esc(v.name||'')}">
      <input class="var-price" type="number" placeholder="Harga" value="${v.price!=null?v.price:''}">
      <input class="var-stock" type="number" placeholder="Stok" value="${v.stock!=null?v.stock:''}">
      <input class="var-minqty" type="number" placeholder="Min Qty" value="${v.min_qty!=null?v.min_qty:5}">
      <button type="button" class="action-btn del" onclick="remVarRow(this)" style="padding:6px 10px">${IC("x")}</button>
    </div>
  `;
}

function addVarRow() {
  const rows = document.getElementById('pm-variant-rows');
  if (!rows) return;
  rows.insertAdjacentHTML('beforeend', varRowHtml(null, rows.children.length));
}

function remVarRow(btn) {
  const rows = document.getElementById('pm-variant-rows');
  if (!rows || rows.children.length <= 1) { toast('Minimal satu varian', 'error'); return; }
  btn.closest('.var-row').remove();
}

async function uploadProductImg() {
  const input = document.getElementById('pm-img-input');
  const file = input.files[0];
  if (!file) return;
  const status = document.getElementById('pm-img-status');
  status.textContent = '⏳ Uploading...';
  const formData = new FormData();
  formData.append('file', file);
  try {
    const res = await fetch('/api/upload/product', { method: 'POST', headers: { 'Authorization': 'Bearer ' + TOKEN }, body: formData });
    const data = await res.json();
    if (!res.ok) { status.textContent = '❌ ' + (data.error || 'Gagal'); return; }
    document.getElementById('pm-img').value = data.url;
    const preview = document.getElementById('pm-img-preview');
    preview.src = data.url; preview.style.display = 'block';
    status.textContent = '✅ Terupload';
  } catch (e) { status.textContent = '❌ ' + e.message; }
}

async function saveProduct() {
  const id = (document.getElementById('pm-id')||{}).value || null;
  const name = document.getElementById('pm-name').value.trim();
  if (!name) { toast('Nama produk wajib diisi', 'error'); return; }
  const catSel = document.getElementById('pm-cat').value;
  const category = catSel === '__other__' ? document.getElementById('pm-cat-other').value.trim() : catSel;
  if (!category) { toast('Kategori wajib diisi', 'error'); return; }
  const weight = Number(document.getElementById('pm-weight').value) || 0;
  const variants = [];
  document.querySelectorAll('#pm-variant-rows .var-row').forEach(row => {
    const v = {
      name: row.querySelector('.var-name').value.trim(),
      price: Number(row.querySelector('.var-price').value) || 0,
      stock: Number(row.querySelector('.var-stock').value) || 0,
      min_qty: Number(row.querySelector('.var-minqty').value) || 1
    };
    if (v.name) variants.push(v);
  });
  if (!variants.length) { toast('Minimal satu varian dengan nama', 'error'); return; }
  const existing = id ? (((PRODUCTS.find(x => x.id === id))||{}).specs||{}) : {};
  const specs = Object.assign({}, existing);
  if (weight > 0) specs.weight = weight; else delete specs.weight;
  const payload = {
    name,
    short_name: document.getElementById('pm-short').value.trim(),
    category,
    img: document.getElementById('pm-img').value,
    desc: document.getElementById('pm-desc').value,
    min_price: Number(document.getElementById('pm-min').value) || 0,
    max_price: Number(document.getElementById('pm-max').value) || 0,
    variants,
    specs,
    active: id ? (((PRODUCTS.find(x => x.id === id))||{}).active !== false) : true
  };
  try {
    if (id) { await api('PUT', '/api/products/' + id, payload); toast('Produk diperbarui ' + IC("check-circle-2") + '', 'success'); }
    else { await api('POST', '/api/products', payload); toast('Produk dibuat ' + IC("check-circle-2") + '', 'success'); }
    closeModal(); fetchAll();
  } catch (e) { toast('Gagal: ' + e.message, 'error'); }
}

function deleteProduct(id) {
  if (!confirm('Hapus produk ini? Tidak bisa di-undo.')) return;
  api('DELETE', '/api/products/' + id)
    .then(() => { PRODUCTS = PRODUCTS.filter(p => p.id !== id); renderTab(); toast('Produk dihapus', 'success'); })
    .catch(e => toast('Gagal hapus: ' + e.message, 'error'));
}

async function saveCustomer(origPhone) {
  const phone = document.getElementById('cf-phone').value.trim();
  const name = document.getElementById('cf-name').value.trim();
  if (!phone || !name) { toast('Nama & No. HP wajib diisi', 'error'); return; }
  const payload = {
    name,
    phone,
    email: document.getElementById('cf-email').value.trim(),
    address: document.getElementById('cf-address').value.trim(),
    city: document.getElementById('cf-city').value.trim(),
    note: document.getElementById('cf-note').value.trim()
  };
  try {
    if (origPhone) { await api('PUT', '/api/customers/' + encodeURIComponent(origPhone), payload); toast('Customer diperbarui ' + IC("check-circle-2") + '', 'success'); }
    else { await api('POST', '/api/customers', payload); toast('Customer ditambahkan ' + IC("check-circle-2") + '', 'success'); }
    closeModal(); fetchAll();
  } catch (e) { toast('Gagal: ' + e.message, 'error'); }
}

function deleteCustomer(phone) {
  if (!confirm('Hapus customer ini dari daftar? (Riwayat pesanan tetap tersimpan di orders)')) return;
  api('DELETE', '/api/customers/' + encodeURIComponent(phone))
    .then(() => { CUSTOMERS = CUSTOMERS.filter(c => c.phone !== phone); renderTab(); toast('Customer dihapus', 'success'); })
    .catch(e => toast('Gagal hapus: ' + e.message, 'error'));
}

async function saveUser(id) {
  const name = document.getElementById('uName').value.trim();
  const email = document.getElementById('uEmail').value.trim();
  const pass = document.getElementById('uPass').value;
  const role = document.getElementById('uRole').value;
  if (!name || !email) { toast('Nama & email wajib diisi', 'error'); return; }
  if (!id && !pass) { toast('Password wajib diisi untuk pengguna baru', 'error'); return; }
  try {
    const body = { name, email, password: pass, role };
    if (id) {
      if (!pass) delete body.password;
      const activeEl = document.getElementById('uActive');
      if (activeEl) body.is_active = activeEl.checked;
      await api('PUT', '/api/admin/users/' + id, body);
    } else {
      await api('POST', '/api/admin/users', body);
    }
    closeModal();
    toast('Pengguna disimpan ' + IC("check-circle-2") + '', 'success');
    renderPengguna(document.getElementById('mainContent'));
  } catch (e) { toast('Gagal: ' + e.message, 'error'); }
}
async function toggleUserActive(id, active) {
  try { await api('PUT', '/api/admin/users/' + id, { is_active: !!active }); toast(active ? 'Pengguna diaktifkan' : 'Pengguna dinonaktifkan', 'success'); renderPengguna(document.getElementById('mainContent')); }
  catch (e) { toast('Gagal: ' + e.message, 'error'); }
}
async function deleteUser(id, name) {
  if (!confirm('Hapus pengguna "' + name + '"? Aksi ini tidak bisa dibatalkan.')) return;
  try { await api('DELETE', '/api/admin/users/' + id); toast('Pengguna dihapus', 'success'); renderPengguna(document.getElementById('mainContent')); }
  catch (e) { toast('Gagal: ' + e.message, 'error'); }
}

      </div>

  document.getElementById('pmBankFields').style.display = t === 'bank' ? '' : 'none';
  document.getElementById('pmQrisFields').style.display = t === 'qris' ? '' : 'none';
}
async function savePayment(id) {
  const type = document.getElementById('pmType').value;
  const label = document.getElementById('pmLabel').value.trim();
  if (!label) { toast('Nama metode wajib diisi', 'error'); return; }
  let image_url = document.getElementById('pmQrisUrl')?.value || '';
  const fileEl = document.getElementById('pmQrisFile');
  if (fileEl && fileEl.files && fileEl.files[0]) {
    toast('Upload QRIS...', 'info');
    try {
      const fd = new FormData();
      fd.append('file', fileEl.files[0]);
      const up = await apiUpload('/api/upload/qris', fd);
      image_url = up.url;
    } catch (e) { toast('Upload gambar gagal: ' + e.message, 'error'); return; }
  }
  const body = {
    type,
    label,
    account_name: document.getElementById('pmAccName')?.value || '',
    account_number: document.getElementById('pmAccNum')?.value || '',
    phone: document.getElementById('pmPhone')?.value || '',
    image_url,
    is_active: document.getElementById('pmActive').checked,
    sort_order: Number(document.getElementById('pmSort').value) || 0
  };
  try {
    if (id) await api('PUT', '/api/payment-methods/' + id, body);
    else await api('POST', '/api/payment-methods', body);
    closeModal();
    toast('Metode pembayaran disimpan ' + IC("check-circle-2") + '', 'success');
    renderPembayaran(document.getElementById('mainContent'));

async function apiUpload(path, formData) {
  const opts = { method: 'POST', body: formData };
  if (TOKEN) opts.headers = { 'Authorization': 'Bearer ' + TOKEN };
  const res = await fetch(path, opts);
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = { error: text }; }
  if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
  return data;
}

function amWrap(prefix, suffix) {
  const ta = document.getElementById('am-content');
  if (!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.substring(start, end) || 'Teks di sini';
  ta.value = ta.value.substring(0, start) + prefix + sel + suffix + ta.value.substring(end);
  ta.focus();
  ta.selectionStart = start + prefix.length;
  ta.selectionEnd = start + prefix.length + sel.length;
}

function amLink() {
  const url = prompt('Masukkan URL tautan:', 'https://');
  if (!url) return;
  amWrap('<a href="' + url.replace(/"/g,'&quot;') + '" target="_blank" rel="noopener">', '</a>');
}

function amImgBtn() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('file', file);
    const ta = document.getElementById('am-content');
    const st = ta.selectionStart;
    const prev = ta.value.substring(0, st);
    const next = ta.value.substring(st);
    const insert = () => { ta.value = prev + '\\n<img src="' + url + '" alt="Gambar artikel" style="max-width:100%;border-radius:8px">\\n' + next; ta.focus(); toast('🖼️ Gambar disisipkan', 'success'); };
    let url = '';
    fetch('/api/upload/content', { method: 'POST', headers: { 'Authorization': 'Bearer ' + TOKEN }, body: fd })
      .then(r => r.json()).then(d => { if (!d.url) throw new Error(d.error || 'Gagal'); url = d.url; insert(); })
      .catch(e => toast('Gagal upload gambar: ' + e.message, 'error'));
  };
  input.click();
}

async function uploadArticleImg() {
  const input = document.getElementById('am-img-input');
  const file = input.files[0];
  if (!file) return;
  const status = document.getElementById('am-img-status');
  status.textContent = '⏳ Uploading...';
  const formData = new FormData();
  formData.append('file', file);
  try {
    const res = await fetch('/api/upload/article', { method: 'POST', headers: { 'Authorization': 'Bearer ' + TOKEN }, body: formData });
    const data = await res.json();
    if (!res.ok) { status.textContent = '❌ ' + (data.error || 'Gagal'); return; }
    document.getElementById('am-img').value = data.url;
    const preview = document.getElementById('am-img-preview');
    preview.src = data.url; preview.style.display = 'block';
    status.textContent = '✅ Terupload';
  } catch (e) { status.textContent = '❌ ' + e.message; }
}

async function saveArticle() {
  const id = (document.getElementById('am-id')||{}).value || null;
  const title = document.getElementById('am-title').value.trim();
  if (!title) { toast('Judul wajib diisi', 'error'); return; }
  const payload = {
    title,
    category: document.getElementById('am-cat').value || 'Blog',
    status: document.getElementById('am-status').value,
    slug: document.getElementById('am-slug').value.trim(),
    image: document.getElementById('am-img').value,
    content: document.getElementById('am-content').value
  };
  try {
    if (id) { await api('PUT', '/api/articles/' + id, payload); toast('Artikel diperbarui ' + IC("check-circle-2") + '', 'success'); }
    else { await api('POST', '/api/articles', payload); toast('Artikel dibuat ' + IC("check-circle-2") + '', 'success'); }
    closeModal(); fetchAll();
  } catch (e) { toast('Gagal: ' + e.message, 'error'); }
}

function toggleArticle(id) {
  const a = ARTICLES.find(x => x.id === id);

  const next = a.status === 'Published' ? 'Draft' : 'Published';
  api('PUT', '/api/articles/' + id, { status: next })

async function loadReport(range) {
  const body = document.getElementById('report-body');
  const statusEl = document.getElementById('report-status');
  if (!body) return;
  const now = new Date();
  const iso = d => d.toISOString().slice(0, 10);
  let from = '', to = iso(now);
  if (range === '7') from = iso(new Date(now.getTime() - 6 * 86400000));
  else if (range === '30') from = iso(new Date(now.getTime() - 29 * 86400000));
  else if (range === 'month') { from = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-01'; }
  else if (range === 'year') { from = now.getFullYear() + '-01-01'; }
  const qs = new URLSearchParams();
  if (from) qs.set('from', from);
  if (to) qs.set('to', to);
  statusEl.textContent = '⏳ Memuat...';
  try {
    const d = await api('GET', '/api/reports?' + qs.toString());
    reportData = d;
    statusEl.textContent = d.from ? `📆 ${d.from} s/d ${d.to}` : '📆 Semua waktu';
    renderReportBody(body, d);
  } catch (e) {
    statusEl.textContent = '❌ Gagal';
    body.innerHTML = `<div class="card"><div class="empty"><div class="empty-icon">${IC("alert-triangle")}</div><div class="empty-text">Gagal memuat: ${esc(e.message)}</div></div></div>`;
  }
}

function exportReportCSV() {
  if (!reportData) { toast('Belum ada data laporan', 'error'); return; }
  const rows = [];
  rows.push(['Murah Plastic — Laporan Penjualan', reportData.from || 'Semua', reportData.to || '']);
  rows.push([]);
  rows.push(['Ringkasan']);
  const sum = reportData.summary || {};
  rows.push(['Omset (Gross)', sum.grossRevenue || 0]);
  rows.push(['Diskon', sum.totalDiscount || 0]);
  rows.push(['Pendapatan Bersih', sum.netRevenue || 0]);
  rows.push(['Biaya Pengiriman', sum.shippingCost || 0]);
  rows.push(['Profit (Kotor)', sum.profit || 0]);
  rows.push(['Total Pesanan', sum.ordersCount || 0]);
  rows.push(['Pesanan Valid', sum.validOrders || 0]);
  rows.push(['Rata-rata Order', sum.avgOrder || 0]);
  rows.push(['Produk Terjual (pcs)', sum.productSold || 0]);
  rows.push(['Pelanggan Unik', sum.uniqueCustomers || 0]);
  rows.push([]);
  rows.push(['Penjualan per Hari']);
  rows.push(['Tanggal', 'Pesanan', 'Omset', 'Diskon', 'Biaya Kirim', 'Pendapatan']);
  (reportData.byDay || []).forEach(r => rows.push([r.date, r.orders, r.gross, r.discount, r.shipping, r.net]));
  rows.push([]);
  rows.push(['Omset per Kategori']);
  rows.push(['Kategori', 'Qty', 'Omset']);
  (reportData.byCategory || []).forEach(r => rows.push([r.category, r.qty, r.gross]));
  rows.push([]);
  rows.push(['Pengiriman per Kurir']);
  rows.push(['Kurir', 'Pesanan', 'Biaya Kirim']);
  (reportData.byCourier || []).forEach(r => rows.push([r.courier, r.orders, r.shippingCost]));
  rows.push([]);
  rows.push(['Top Produk']);
  rows.push(['Produk', 'Qty', 'Omset']);
  (reportData.topProducts || []).forEach(r => rows.push([r.name, r.qty, r.gross]));
  const csv = rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'laporan-murah-plastic-' + (reportData.from || 'all') + '-to-' + (reportData.to || 'now') + '.csv';

}

function tierRowHtml(t, i) {
  return `<div style="display:flex;gap:6px;align-items:center">
    <input type="number" class="tier-min" value="${esc(t.min)}" placeholder="Min qty" min="1" style="flex:1;padding:7px 10px;border:2px solid var(--border);border-radius:8px;font-size:13px;font-family:var(--font)">

    <button class="action-btn del" style="padding:6px 9px" onclick="this.parentElement.remove()" title="Hapus">${IC("x")}</button>

function addTierRow() {
  const wrap = document.getElementById('set-tier-rows');
  if (wrap) wrap.insertAdjacentHTML('beforeend', tierRowHtml({min:'',pct:''}, 0));
}
async function saveDiscountSettings() {
  const member = parseInt(document.getElementById('set-member-disc').value || '0', 10);
  const freeShip = parseInt(document.getElementById('set-free-ship').value || '0', 10);
  const rows = Array.from(document.querySelectorAll('#set-tier-rows > div')).map(r => ({
    min: parseInt((r.querySelector('.tier-min')||{}).value || '0', 10),
    pct: parseInt((r.querySelector('.tier-pct')||{}).value || '0', 10)
  })).filter(t => t.min > 0 && t.pct > 0);
  if (member < 0 || member > 100) { toast('Diskon member harus 0-100%', 'error'); return; }
  if (freeShip < 0) { toast('Minimal gratis ongkir tidak valid', 'error'); return; }
  if (!rows.length) { toast('Minimal 1 tingkat diskon qty', 'error'); return; }
  const dup = rows.find((t, i) => rows.some((x, j) => j !== i && x.min === t.min));
  if (dup) { toast('Ada min qty yang sama (' + dup.min + '), gabungkan atau ubah', 'error'); return; }
  try {
    await api('PUT', '/api/settings', { key: 'member_discount', value: member });
    await api('PUT', '/api/settings', { key: 'free_ship_min', value: freeShip });
    await api('PUT', '/api/settings', { key: 'discount_tiers', value: JSON.stringify(rows.sort((a,b)=>b.min-a.min)) });
    SETTINGS.member_discount = String(member);
    SETTINGS.free_ship_min = String(freeShip);
    SETTINGS.discount_tiers = JSON.stringify(rows.sort((a,b)=>b.min-a.min));
    toast('Pengaturan diskon tersimpan ' + IC("check-circle-2") + '', 'success');
  } catch (e) {
    toast('Gagal simpan: ' + e.message, 'error');
  }
}

function openAdminNotif(i) {
  const n = ADMIN_NOTIFS[i];
  if (!n) return;
  if (!n.is_read) api('PUT', '/api/notifications/' + n.id + '/read').then(() => { n.is_read = 1; updateAdminNotifBadge(); });
  document.getElementById('adminNotifPanel').classList.remove('open');
  if (n.type === 'order' || n.type === 'order_status') setTab('orders');
  else if (n.type === 'komplain') setTab('komplain');
  else if (n.type === 'question' || n.type === 'qna_answer') setTab('qna');
  else setTab('dashboard');
}
async function updateAdminNotifBadge() {
  const badge = document.getElementById('adminNotifBadge');
  if (!badge) return;
  try {
    const r = await api('GET', '/api/notifications/unread-count');
    const c = (r && r.count) || 0;
    if (c > 0) { badge.textContent = c > 9 ? '9+' : c; badge.style.display = 'flex'; }
    else badge.style.display = 'none';
  } catch (e) { badge.style.display = 'none'; }
}
document.addEventListener('click', function (e) {
  const p = document.getElementById('adminNotifPanel');
  const bell = document.getElementById('adminNotifBell');
  if (p && p.classList.contains('open') && bell && !p.contains(e.target) && !bell.contains(e.target)) {
    p.classList.remove('open');
  }
});
setInterval(updateAdminNotifBadge, 30000);

// ── Init ──
// Auto-fit angka statistik — shrink font sampai muat dalam 1 baris
function fitStatValues() {
  const ctx = document.createElement('canvas').getContext('2d');
  const els = document.querySelectorAll('.stat-value');
  for (const el of els) {
    const parent = el.parentElement;
    if (!parent) continue;
    const pcs = getComputedStyle(parent);
    const avail = parent.clientWidth - (parseFloat(pcs.paddingLeft) || 0) - (parseFloat(pcs.paddingRight) || 0) - 2;
    const base = getComputedStyle(el);
    let fs = parseFloat(base.fontSize) || 24;
    const text = el.textContent || '';
    const setFont = () => ctx.font = base.font.replace(/\d+(\.\d+)?px/, fs + 'px');
    setFont();
    while (ctx.measureText(text).width > avail && fs > 10) {
      fs -= 0.5;
      setFont();
    }
    el.style.fontSize = fs + 'px';
  }
}
// Observer otomatis — shrink setiap kali konten berubah
new MutationObserver(() => requestAnimationFrame(fitStatValues))
  .observe(document.getElementById('mainContent'), { childList: true, subtree: true });

(function init() {
  if (TOKEN) {
    startPolling();
    updateAdminNotifBadge();
  } else {
    document.getElementById('loginPage').style.display = 'flex';
  }
})();
</script>
