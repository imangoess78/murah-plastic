<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#C8191A;--red-dark:#9E1010;--red-light:#FFF0F0;
  --gold:#C9890A;--gold-light:#FFF8E7;--gold-bright:#F5C842;
  --grad-hero:linear-gradient(135deg,#6B0000 0%,#C8191A 40%,#E86510 75%,#C9890A 100%);
  --grad-gold:linear-gradient(90deg,#C9890A 0%,#F5C842 50%,#C9890A 100%);
  --grad-btn:linear-gradient(135deg,#C8191A 0%,#E86510 100%);
  --dark:#1A0A00;--mid:#5A3A1A;--muted:#9A7A5A;
  --light:#FFFDF8;--border:rgba(201,137,10,0.15);
  --shadow:0 2px 16px rgba(201,137,10,0.10);
  --radius:16px;--radius-sm:10px;
  --font:"Plus Jakarta Sans",system-ui,sans-serif;
  --sidebar-w:250px;
}
body{font-family:var(--font);background:var(--gold-light);color:var(--dark);min-height:100vh;display:flex;overflow-x:hidden}
html{overflow-x:hidden}
.sidebar{width:var(--sidebar-w);background:white;border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;box-shadow:var(--shadow);transition:transform .25s ease;transform:none!important;visibility:visible!important}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-logo .logo-box{width:40px;height:40px;background:var(--grad-hero);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:white;flex-shrink:0}
.sidebar-logo .brand{font-size:16px;font-weight:900;color:var(--dark);line-height:1.1}
.sidebar-logo .brand span{color:var(--gold)}
.sidebar-logo .sub{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:0}
.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-section{padding:8px 16px 4px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-radius:0;transition:background .15s;font-size:13px;font-weight:600;color:var(--mid);border:none;background:none;width:100%;text-align:left;margin:1px 0}
.nav-item:hover{background:var(--gold-light);color:var(--gold)}
.nav-item.active{background:var(--red-light);color:var(--red);border-left:3px solid var(--red);font-weight:800}
.nav-item .icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border)}
.admin-user{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--gold-light)}
.admin-avatar{width:32px;height:32px;border-radius:50%;background:var(--grad-hero);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:white;flex-shrink:0}
.admin-info{flex:1;min-width:0}
.admin-name{font-size:12px;font-weight:800;color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-role{font-size:10px;color:var(--muted);font-weight:600}
.logout-btn{background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:6px;transition:all .15s;flex-shrink:0;width:auto;height:auto}
.logout-btn:hover{color:var(--red);border-color:var(--red);background:var(--red-light)}
.main{flex:1;margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;min-width:0;max-width:100vw}
.topbar{background:white;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.03);min-width:0}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.mobile-menu-btn{display:none;background:none;border:none;color:var(--dark);font-size:22px;cursor:pointer;padding:4px;margin-right:0;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:800;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.notif-bell-btn{position:relative;background:#fff;border:1px solid var(--border);border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color .15s}
.notif-bell-btn:hover{border-color:var(--gold)}
.notif-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:10px;min-width:16px;height:16px;padding:0 4px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.toko-link{font-size:12px;color:var(--gold);font-weight:800;text-decoration:none;white-space:nowrap}
.toko-link:hover{text-decoration:underline}
.content{flex:1;padding:24px;max-width:960px;width:100%;margin:0 auto;min-width:0;box-sizing:border-box}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)!important;visibility:visible!important;width:82vw;max-width:290px}
  .sidebar.open{transform:translateX(0)!important;visibility:visible!important}
  .overlay.open{display:block}
  .mobile-menu-btn{display:block}
  .main{margin-left:0;min-width:0}
  .topbar{flex-direction:row;flex-wrap:nowrap;gap:10px;padding:12px 16px;font-size:14px}
  .topbar-left{flex:1;min-width:0}
  .topbar-right{flex-wrap:nowrap;justify-content:flex-end;margin-left:auto}
  .topbar .toko-link{color:var(--gold)}
  .content{padding:12px;min-width:0}
  .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat-card{min-width:0;padding:14px 16px}
  .stat-value{font-size:18px}
  .stat-label{font-size:10px}
  .stat-sub{font-size:10px}
  .order-summary{padding:12px 14px}
  .order-detail{padding:0 14px 14px}
  .komplain-ajukan{padding:14px}
  .wl-grid{grid-template-columns:repeat(2,1fr)}
  .settings-form{padding:16px}
  .rv-product{padding:12px 14px}
}
@media(max-width:420px){
  .stats-grid{gap:8px}
  .stat-card{padding:12px}
  .stat-value{font-size:18px}
  .order-meta{flex-direction:column;align-items:flex-start;gap:2px}
  .order-id{font-size:11px}
  .od-actions .btn,.od-actions .btn-sm{width:100%;text-align:center}
  .topbar{padding:10px 12px}
  .topbar-title{font-size:14px}
}
@media(min-width:769px){
  .overlay{display:none!important}
}
/* Akun specific styles */
.akun-login-cta{text-align:center;padding:60px 20px;background:var(--grad-hero);border-radius:var(--radius);color:white}
.akun-login-cta .mp-auth-title{font-size:22px;font-weight:900}
.akun-login-cta .mp-auth-sub{font-size:14px;opacity:.85;max-width:400px;margin:8px auto 20px;line-height:1.6}
.akun-login-cta .btn-red{background:white;color:var(--red);border:none;padding:12px 24px;font-size:14px;font-weight:800;border-radius:12px;cursor:pointer;font-family:var(--font)}
.akun-login-cta .btn-outline{background:transparent;color:white;border:2px solid rgba(255,255,255,.4);padding:12px 24px;font-size:14px;font-weight:800;border-radius:12px;cursor:pointer;font-family:var(--font);text-decoration:none}
.akun-login-cta .btn-ghost{color:white;border-color:rgba(255,255,255,.3);padding:10px 20px;font-size:13px;font-weight:700;border-radius:12px;text-decoration:none;display:inline-block}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stat-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.stat-value{font-size:24px;font-weight:900;color:var(--dark)}
.stat-sub{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600}
.stat-card.gold .stat-value{color:var(--gold)}
.stat-card.green .stat-value{color:#16a34a}
.stat-card.red .stat-value{color:var(--red)}
.stat-card.blue .stat-value{color:#2563eb}
.order-card{background:white;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.order-summary{padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.order-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.order-id{font-size:12px;font-weight:800;color:var(--mid)}
.order-date{font-size:11px;color:var(--muted)}
.order-items{font-size:12px;color:var(--mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.order-total{font-size:15px;font-weight:900;color:var(--red)}
.order-detail{display:none;padding:0 16px 16px;border-top:1px solid var(--border);margin-top:8px;padding-top:12px}
.order-detail.open{display:block}
.status-badge{padding:3px 10px;border-radius:99px;font-size:10px;font-weight:800;white-space:nowrap;text-transform:uppercase}
.st-menunggu{background:#FFF8E6;color:#B8860B}
.st-lunas{background:#E8F5E9;color:#2E7D32}
.st-dikirim{background:#E3F2FD;color:#1565C0}
.st-selesai{background:#F3E5F5;color:#7B1FA2}
.st-batal{background:#FFEBEE;color:#C62828}
.od-items{list-style:none;padding:0;margin:8px 0}
.od-items li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;align-items:center}
.od-item-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--dark)}
.od-item-qty{color:var(--muted);font-weight:700}
.od-item-price{color:var(--red);font-weight:800;min-width:80px;text-align:right}
.od-info{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.od-info-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.od-info-label{color:var(--muted);font-weight:600}
.od-info-value{font-weight:700;color:var(--dark);text-align:right}
.od-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.od-actions .btn,.od-actions .btn-sm{text-decoration:none;display:inline-block;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:800;font-family:var(--font);cursor:pointer;border:none;transition:all .15s}
.od-actions .btn{background:var(--grad-btn);color:white}
.od-actions .btn-sm{background:white;border:1px solid var(--border);color:var(--mid)}
.od-actions .btn-wa{background:#25D366;color:white}
.od-timeline{margin:8px 0;padding:0;list-style:none}
.od-timeline li{display:flex;gap:10px;padding:6px 0;font-size:12px;position:relative}
.od-timeline .tl-dot{width:10px;height:10px;border-radius:50%;background:var(--border);flex-shrink:0;margin-top:3px}
.od-timeline .tl-dot.done{background:var(--gold)}
.od-timeline .tl-dot.active{background:var(--gold);box-shadow:0 0 0 3px var(--gold-light)}
.od-timeline .tl-text{color:var(--muted);font-weight:600}
.od-timeline .tl-text.done{color:var(--dark)}
.od-timeline .tl-text.active{color:var(--gold);font-weight:800}
.od-timeline .tl-date{font-size:10px;color:var(--muted);margin-top:1px}
/* Komplain tab */
.komplain-ajukan{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.komplain-ajukan .title{font-size:14px;font-weight:800;color:var(--dark);margin-bottom:10px}
.komplain-ajukan .order-list{display:flex;flex-direction:column;gap:8px}
.komplain-ajukan .order-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--gold-light);border-radius:10px;font-size:12px;gap:8px}
.komplain-ajukan .order-item button{background:var(--red);color:white;border:none;padding:7px 14px;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;font-family:var(--font)}
.komplain-ajukan .order-item .oi-info{flex:1;min-width:0}
.komplain-ajukan .order-item .oi-id{font-weight:800;color:var(--dark)}
.komplain-ajukan .order-item .oi-sisa{font-size:11px;color:var(--muted)}
/* Wishlist */
.wl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.wl-item{background:white;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;position:relative;text-align:center}
.wl-item img{width:100%;height:100px;object-fit:contain;margin-bottom:8px}
.wl-item .wl-name{font-size:12px;font-weight:700;color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-item .wl-price{font-size:14px;font-weight:900;color:var(--red);margin-top:4px}
.wl-item .wl-rm{position:absolute;top:6px;right:6px;background:var(--red-light);color:var(--red);border:none;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* Review */
.rv-product{background:white;border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.rv-product .rv-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.rv-product .rv-head .rv-name{font-size:13px;font-weight:700;color:var(--dark)}
.rv-product .rv-head button{background:var(--gold-light);border:1px solid var(--border);padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;color:var(--gold);font-family:var(--font)}
.rv-form{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.rv-form.open{display:block}
.rv-stars{display:flex;gap:4px;margin-bottom:8px;justify-content:center}
.rv-star{font-size:24px;cursor:pointer;color:#E0D5C5;transition:color .15s}
.rv-star.sel{color:var(--gold-bright)}
.rv-textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;font-family:var(--font);resize:vertical;color:var(--dark);min-height:60px;box-sizing:border-box}
.rv-textarea:focus{outline:none;border-color:var(--gold)}
.rv-submit{background:var(--grad-btn);color:white;border:none;padding:9px 18px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;margin-top:8px;font-family:var(--font)}
.rv-status{font-size:11px;font-weight:700;margin-top:6px;color:var(--red)}
/* Settings */
.settings-form{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:22px;max-width:500px;box-shadow:var(--shadow)}
.settings-form .sf-group{margin-bottom:16px}
.settings-form .sf-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.settings-form input,.settings-form textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:var(--font);color:var(--dark);box-sizing:border-box}
.settings-form input:focus,.settings-form textarea:focus{outline:none;border-color:var(--gold)}
.settings-form .save-btn{background:var(--grad-btn);color:white;border:none;padding:11px 22px;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;width:100%;font-family:var(--font)}
.settings-form .save-status{font-size:12px;font-weight:700;margin-top:8px;text-align:center}
/* Full-screen login gate (sama seperti /admin) */
.akun-login-page{display:none;align-items:center;justify-content:center;min-height:100vh;background:var(--grad-hero);position:fixed;inset:0;z-index:1000;padding:20px;box-sizing:border-box}
.akun-login-card{background:white;border-radius:var(--radius);padding:40px 32px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.akun-login-logo{width:64px;height:64px;background:var(--grad-hero);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:white;margin:0 auto 16px}
.akun-login-title{font-size:22px;font-weight:900;color:var(--dark);margin-bottom:4px}
.akun-login-title span{color:var(--gold)}
.akun-login-sub{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.6}
.akun-login-actions{display:flex;flex-direction:column;gap:10px}
.akun-login-btn{background:var(--grad-btn);color:white;border:none;border-radius:24px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:var(--font);transition:opacity .15s;width:100%}
.akun-login-btn:hover{opacity:.9}
.akun-login-btn.outline{background:transparent;color:var(--red);border:2px solid var(--border)}
.akun-login-home{display:block;margin-top:14px;font-size:13px;font-weight:700;color:var(--muted);text-decoration:none}
.akun-login-home:hover{text-decoration:underline}
/* Mobile responsive */
@media(max-width:768px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .wl-grid{grid-template-columns:repeat(2,1fr)}
}
</style>

<body>
<div class="akun-login-page" id="akunLoginPage">
  <div class="akun-login-card">
    <div class="akun-login-logo">M</div>
    <div class="akun-login-title">Murah <span>Plastic</span></div>
    <div class="akun-login-sub">Masuk dengan akun member untuk melihat pesanan, wishlist, dan review kamu.</div>
    <div class="akun-login-actions">
      <button class="akun-login-btn" type="button" onclick="MP.openAuth('login')">Masuk</button>
      <button class="akun-login-btn outline" type="button" onclick="MP.openAuth('register')">Daftar Gratis</button>
    </div>
    <a class="akun-login-home" href="/">&#8592; Kembali ke Home</a>
  </div>
</div>
<script>
/* Anti-flash: langsung tampilkan layar login bila belum ada token */
(function(){
  try {
    if (!localStorage.getItem('mp_token') || !localStorage.getItem('mp_user')) {
      var lp = document.getElementById('akunLoginPage');
      if (lp) lp.style.display = 'flex';
    }
  } catch (e) {}
})();
</script>
<div class="overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-box">M</div>
    <div><div class="brand">Murah <span>Plastic</span></div><div class="sub">Akun Saya</div></div>
  </div>
  <div class="sidebar-nav">
    <div class="nav-section">Menu</div>
    <button class="nav-item active" onclick="Akun.tab('dashboard')" id="nav-dashboard"><span class="icon"><svg class="ic" aria-hidden="true"><use href="#i-layout-dashboard"/></svg></span>Dashboard</button>
    <button class="nav-item" onclick="Akun.tab('pesanan')" id="nav-pesanan"><span class="icon"><svg class="ic" aria-hidden="true"><use href="#i-package"/></svg></span>Pesanan</button>
    <button class="nav-item" onclick="Akun.tab('komplain')" id="nav-komplain"><span class="icon"><svg class="ic" aria-hidden="true"><use href="#i-wrench"/></svg></span>Komplain</button>
    <button class="nav-item" onclick="Akun.tab('wishlist')" id="nav-wishlist"><span class="icon"><svg class="ic" aria-hidden="true"><use href="#i-heart"/></svg></span>Wishlist</button>
    <button class="nav-item" onclick="Akun.tab('review')" id="nav-review"><span class="icon"><svg class="ic" aria-hidden="true"><use href="#i-star"/></svg></span>Review</button>
    <button class="nav-item" onclick="Akun.tab('pengaturan')" id="nav-pengaturan"><span class="icon"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg></span>Pengaturan</button>
  </div>
  <div class="sidebar-footer">
    <a href="/" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:8px;padding:8px 6px;font-size:12.5px;font-weight:700;color:var(--gold);text-decoration:none;border-bottom:1px solid var(--border);margin-bottom:10px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Beranda <span style="margin-left:auto"><svg class="ic" aria-hidden="true"><use href="#i-arrow-up-right"/></svg></span></a>
    <div class="admin-user">
      <div class="admin-avatar" id="sidebarAvatar">M</div>
      <div class="admin-info">
        <div class="admin-name" id="sidebarName">-</div>
        <div class="admin-role">Customer</div>
      </div>
      <button class="logout-btn" onclick="MP.logout()" title="Keluar"><svg class="ic" aria-hidden="true"><use href="#i-log-out"/></svg></button>
    </div>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="mobile-menu-btn" onclick="toggleSidebar()"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <div class="topbar-title" id="topbarTitle"><svg class="ic" aria-hidden="true"><use href="#i-layout-dashboard"/></svg> Dashboard</div>
    </div>
    <div class="topbar-right">
      <button class="notif-bell-btn" id="mpNotifBell" type="button" onclick="MP.toggleNotif(event)" title="Notifikasi"><svg class="ic" aria-hidden="true"><use href="#i-bell"/></svg><span class="notif-badge" id="mpNotifBadge" style="display:none">0</span></button>
      <a href="/" class="toko-link"><svg class="ic" aria-hidden="true"><use href="#i-globe"/></svg> Toko <svg class="ic" aria-hidden="true"><use href="#i-arrow-up-right"/></svg></a>
    </div>
  </div>
  <div class="content" id="mainContent"></div>
</div>

<script>

// ── Icon helper: returns inline SVG <use> referencing the sprite ──
window.IC = (n) => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
var IC = window.IC;
</script>
<script src="/assets/site.js"></script>
<script>
(function () {
  const SP = MP;
  const STATUS_LABELS = {
    'Menunggu Konfirmasi': { label: 'Menunggu Konfirmasi', cls: 'st-menunggu' },
    'Menunggu Pembayaran': { label: 'Menunggu Pembayaran', cls: 'st-menunggu' },
    'Lunas': { label: 'Lunas', cls: 'st-lunas' },
    'Dikirim': { label: 'Dikirim', cls: 'st-dikirim' },
    'Selesai': { label: 'Selesai', cls: 'st-selesai' },
    'Batal': { label: 'Batal', cls: 'st-batal' }
  };
  const STATUS_ORDER = ['Menunggu Konfirmasi', 'Menunggu Pembayaran', 'Lunas', 'Dikirim', 'Selesai'];
  let state = { orders: [], wishlist: [], reviews: [], profile: null, tab: 'dashboard' };
  let komplainOrder = null, komplainReason = null, komplainRefundType = 'penuh', komplainRefundItems = {};

  function statusBadge(s) {
    const st = STATUS_LABELS[s] || { label: s, cls: 'st-menunggu' };
    return '<span class="status-badge ' + st.cls + '">' + st.label + '</span>';
  }
  function fmtId(id) { return id && id.length > 12 ? id.substring(0, 12) + '...' : id; }
  function starsHtml(n) { return '★'.repeat(Math.max(1, Math.min(5, n || 5))) + '☆'.repeat(5 - Math.max(1, Math.min(5, n || 5))); }
  function imgOf(p) { return (p && p.img) ? p.img : (p && p.image) ? p.image : ''; }
  function fmtDate(d) {
    if (!d) return '-';
    const dt = new Date(d);
    try { return dt.toLocaleDateString('id-ID', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return d; }
  }
  function fmtJoinDate(d) {
    if (!d) return '-';
    let dt = new Date(d);
    if (isNaN(dt.getTime())) {
      const m = String(d).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (m) dt = new Date(+m[3], +m[2] - 1, +m[1]);
      else return String(d);
    }
    try { return dt.toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' }); }
    catch (e) { return String(d); }
  }
  function api(url, opts) {
    const token = SP.getToken();
    const h = { 'Authorization': 'Bearer ' + (token || '') };
    if (opts && opts.body && !(opts.body instanceof FormData)) h['Content-Type'] = 'application/json';
    return fetch(url, { ...opts, headers: { ...h, ...((opts && opts.headers) || {}) } }).then(function(res) {
      // Sesi kedaluwarsa / token tidak valid → buang token & tampilkan layar login
      if (res.status === 401 && token) {
        try { localStorage.removeItem('mp_token'); localStorage.removeItem('mp_user'); } catch (e) {}
        window.dispatchEvent(new CustomEvent('mp:auth', { detail: null }));
      }
      return res;
    });
  }

  function setTitle(title) {
    var el = document.getElementById('topbarTitle');
    if (el) el.textContent = title;
  }

  function setSidebarActive(tab) {
    document.querySelectorAll('.nav-item').forEach(function(el) { el.classList.remove('active'); });
    var navEl = document.getElementById('nav-' + tab);
    if (navEl) navEl.classList.add('active');
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
  }
  window.toggleSidebar = function() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('open');
  };
  window.closeSidebar = closeSidebar;

  // ── Render utama ──
  function showLoginGate() { var lp = document.getElementById('akunLoginPage'); if (lp) lp.style.display = 'flex'; }
  function hideLoginGate() { var lp = document.getElementById('akunLoginPage'); if (lp) lp.style.display = 'none'; }
  async function render() {
    const wrap = document.getElementById('mainContent');
    const u = SP.getUser();
    const token = SP.getToken();

    // Update sidebar name + avatar
    var sn = document.getElementById('sidebarName');
    if (sn) sn.textContent = (u && u.name) ? u.name : '-';
    var sa = document.getElementById('sidebarAvatar');
    if (sa) sa.textContent = (u && u.name) ? u.name[0].toUpperCase() : 'M';

    if (!u || !token) {
      showLoginGate();
      wrap.innerHTML = '<div class="akun-login-cta">'
        + '<div class="mp-auth-title">' + IC("lock") + ' Masuk / Daftar Member</div>'
        + '<div class="mp-auth-sub" style="margin:8px 0 16px">Dapatkan diskon member 10% + lacak pesanan, wishlist, dan review produk di dashboard.</div>'
        + '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'
        + '<button class="btn-red" style="border:none;padding:12px 24px;font-size:14px;font-weight:800;border-radius:12px;cursor:pointer;font-family:var(--font)" onclick="MP.openAuth(\'login\')">Masuk</button>'
        + '<button class="btn-outline" style="padding:12px 24px;font-size:14px;font-weight:800;border-radius:12px;cursor:pointer;font-family:var(--font)" onclick="MP.openAuth(\'register\')">Daftar Gratis</button>'
        + '</div>'
        + '<div style="margin-top:14px"><a class="btn-ghost" href="/" style="color:white;border-color:rgba(255,255,255,.3);padding:10px 20px;font-size:13px;font-weight:700;border-radius:12px;text-decoration:none;display:inline-block">' + IC("arrow-left") + ' Kembali ke Home</a></div>'
        + '</div>';
      return;
    }

    hideLoginGate();

    wrap.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">' + IC("clock") + ' Memuat data...</div>';

    // Load data paralel
    try {
      const [ordersRes, wlRes, meRes, rvRes] = await Promise.all([
        api('/api/account/orders'),
        api('/api/account/wishlist'),
        api('/api/account/me'),
        api('/api/reviews/mine')
      ]);
      state.orders = ordersRes.ok ? await ordersRes.json() : [];
      state.wishlist = wlRes.ok ? await wlRes.json() : [];
      state.profile = meRes.ok ? await meRes.json() : u;
      state.myReviews = rvRes.ok ? await rvRes.json() : [];
      const reviewedSet = new Set(state.myReviews.map(r => r.product_id));
      const reviewable = {};
      state.orders.forEach(function(o) {
        if (!(o.status === 'Lunas' || o.status === 'Dikirim' || o.status === 'Selesai')) return;
        (o.items || []).forEach(function(i) {
          var pid = i.productId || i.product_id;
          if (!pid || reviewedSet.has(pid)) return;
          reviewable[pid] = reviewable[pid] || { id: pid, name: i.productName || i.product_name || 'Produk', slug: i.slug || '' };
        });
      });
      state.reviewable = Object.values(reviewable);
    } catch (e) { console.error('akun load failed', e); }

    // Render tab yang aktif
    renderTab();
  }

  function renderTab() {
    var c = document.getElementById('mainContent');
    if (!c) return;
    var tab = state.tab || 'dashboard';
    if (tab === 'dashboard') renderDashboard(c);
    else if (tab === 'pesanan') renderPesanan(c);
    else if (tab === 'komplain') renderKomplain(c);
    else if (tab === 'wishlist') renderWishlist(c);
    else if (tab === 'review') renderReview(c);
    else if (tab === 'pengaturan') renderPengaturan(c);
  }

  // ── Dashboard ──
  function renderDashboard(c) {
    var u = state.profile || SP.getUser() || {};
    var joinDate = u.joinDate ? fmtJoinDate(u.joinDate) : '-';
    var totalOrders = state.orders.length;
    var totalSpent = state.orders.reduce(function(s, o) { return s + (o.total || 0); }, 0);
    var pendingOrders = state.orders.filter(function(o) { return o.status && (o.status.indexOf('Menunggu') >= 0 || o.status === 'Pending'); }).length;
    var komplainCount = state.orders.filter(function(o) { return o.complaint; }).length;
    var reviewCount = state.reviewable ? state.reviewable.length : 0;
    var recentOrders = state.orders.slice(0, 5);

    setTitle('📊 Dashboard');
    setSidebarActive('dashboard');
    c.innerHTML = '<div class="stats-grid">'
      + '<div class="stat-card gold"><div class="stat-label">Total Pesanan</div><div class="stat-value">' + totalOrders + '</div><div class="stat-sub">' + pendingOrders + ' pending</div></div>'
      + '<div class="stat-card green"><div class="stat-label">Total Belanja</div><div class="stat-value">' + SP.fmt(totalSpent) + '</div></div>'
      + '<div class="stat-card blue"><div class="stat-label">Wishlist</div><div class="stat-value">' + state.wishlist.length + '</div></div>'
      + '<div class="stat-card red"><div class="stat-label">Komplain</div><div class="stat-value">' + komplainCount + '</div></div>'
      + '</div>'
      + '<div style="background:white;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)">'
      + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">'
      + '<div style="width:44px;height:44px;border-radius:50%;background:var(--grad-hero);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:white;flex-shrink:0">' + SP.esc((u.name || '?')[0].toUpperCase()) + '</div>'
      + '<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:900;color:var(--dark)">' + SP.esc(u.name || '-') + '</div><div style="font-size:11px;color:var(--muted)">Member sejak ' + joinDate + (u.city ? ' • ' + IC("map-pin") + ' ' + SP.esc(u.city) : '') + '</div></div>'
      + '</div>'
      + '</div>'
      + '<div style="background:white;border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)">'
      + '<div style="font-size:13px;font-weight:800;color:var(--dark);margin-bottom:10px">' + IC("package") + ' Pesanan Terbaru</div>'
      + (recentOrders.length ? recentOrders.map(function(o) {
          var itemsText = (o.items || []).map(function(i) { return (i.productName || i.product_name || 'Produk') + (i.variantName ? ' (' + i.variantName + ')' : ''); }).join(', ');
          return '<div class="order-card"><div class="order-summary" style="cursor:pointer" onclick="Akun.tab(\'pesanan\')">'
            + '<div class="order-head"><div class="order-id">' + IC("shopping-cart") + ' ' + SP.esc(o.id) + '</div>' + statusBadge(o.status) + '</div>'
            + '<div class="order-date">' + fmtDate(o.date || o.created_at) + '</div>'
            + '<div class="order-items">' + SP.esc(itemsText.substring(0, 60)) + '</div>'
            + '<div class="order-meta"><span>' + SP.esc(o.payment || o.payment_method || '—') + '</span><span class="order-total">' + SP.fmt(o.total || 0) + '</span></div>'
            + '</div></div>';
        }).join('') : '<div style="font-size:12px;color:var(--muted);padding:20px;text-align:center">Belum ada pesanan. Mulai belanja yuk! ' + IC("shopping-bag") + '️</div>')
      + '</div>';
  }

  // ── Tab Pesanan ──
  function renderPesanan(c) {
    setTitle('📦 Pesanan Saya');
    setSidebarActive('pesanan');
    var orders = state.orders;
    var activeOrders = orders.filter(function(o) { return o.status !== 'Batal'; });
    if (activeOrders.length === 0) {
      c.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);font-size:14px">Belum ada pesanan aktif.</div>';
      return;
    }
    c.innerHTML = activeOrders.map(function(o) {
      var items = o.items || [];
      var itemsText = items.map(function(i) { return (i.productName || i.product_name || 'Produk') + (i.variantName ? ' (' + i.variantName + ')' : ''); }).join(', ');
      var more = items.length > 2 ? ' (+' + (items.length - 2) + ')' : '';
      var shipText = o.shipping === 'gratis' ? '' + IC("truck") + ' Gratis Ongkir' : (o.shipping_cost ? SP.fmt(o.shipping_cost) : '—');
      var canReorder = items.length > 0 && o.status !== 'Batal';
      var canReview = o.status === 'Selesai' || o.status === 'Dikirim' || o.status === 'Lunas';
      return '<div class="order-card">'
        + '<div class="order-summary" onclick="Akun.toggleOrder(this)">'
        + '<div class="order-head"><div class="order-id">' + IC("shopping-cart") + ' ' + SP.esc(o.id) + '</div>' + statusBadge(o.status) + '</div>'
        + '<div class="order-date">' + fmtDate(o.date || o.created_at) + '</div>'
        + '<div class="order-items">' + SP.esc(itemsText) + (more ? '<span style="color:var(--muted)">' + more + '</span>' : '') + '</div>'
        + '<div class="order-meta"><span>' + SP.esc(o.payment || o.payment_method || '—') + '</span><span class="order-total">' + SP.fmt(o.total || 0) + '</span></div>'
        + '</div>'
        + '<div class="order-detail">'
        + '<div style="font-size:13px;font-weight:900;color:var(--dark);margin-top:12px">' + IC("package") + ' Detail Pesanan</div>'
        + '<ul class="od-items">' + items.map(function(i) {
          return '<li><span class="od-item-name">' + SP.esc((i.productName || i.product_name || 'Produk') + (i.variantName ? ' (' + i.variantName + ')' : '')) + '</span>'
            + '<span class="od-item-qty">× ' + (i.qty || 1) + '</span>'
            + '<span class="od-item-price">' + SP.fmt((i.price || 0) * (i.qty || 1)) + '</span></li>';
        }).join('') + '</ul>'
        + '<div class="od-info">'
        + (o.sub ? '<div class="od-info-row"><span class="od-info-label">Subtotal</span><span class="od-info-value">' + SP.fmt(o.sub) + '</span></div>' : '')
        + (o.member_amt ? '<div class="od-info-row"><span class="od-info-label">Diskon Member</span><span class="od-info-value" style="color:#16A34A">-' + SP.fmt(o.member_amt) + '</span></div>' : '')
        + (o.disc_amt ? '<div class="od-info-row"><span class="od-info-label">Diskon</span><span class="od-info-value" style="color:#16A34A">-' + SP.fmt(o.disc_amt) + '</span></div>' : '')
        + (o.voucher_amt ? '<div class="od-info-row"><span class="od-info-label">Voucher</span><span class="od-info-value" style="color:#16A34A">-' + SP.fmt(o.voucher_amt) + '</span></div>' : '')
        + '<div class="od-info-row"><span class="od-info-label">Ongkir</span><span class="od-info-value">' + shipText + '</span></div>'
        + '<div class="od-info-row"><span class="od-info-label">Total</span><span class="od-info-value" style="color:var(--red);font-size:15px;font-weight:900">' + SP.fmt(o.total || 0) + '</span></div>'
        + '<div class="od-info-row"><span class="od-info-label">Pembayaran</span><span class="od-info-value">' + SP.esc(o.payment || o.payment_method || '—') + '</span></div>'
        + (o.resi ? '<div class="od-info-row"><span class="od-info-label">No. Resi</span><span class="od-info-value">' + SP.esc(o.resi) + '</span></div>' : '')
        + '<div class="od-info-row"><span class="od-info-label">Alamat</span><span class="od-info-value" style="max-width:55%">' + SP.esc(o.customer_address || '') + '</span></div>'
        + (o.customer_note ? '<div class="od-info-row"><span class="od-info-label">Catatan</span><span class="od-info-value" style="max-width:55%">' + SP.esc(o.customer_note) + '</span></div>' : '')
        + '</div>'
        + (o.status !== 'Batal' ? '<div style="font-size:13px;font-weight:900;color:var(--dark)">' + IC("truck") + ' Lacak Pengiriman</div>' + timelineHtml(o) : '')
        + '<div class="od-actions">'
        + (canReorder ? '<button class="btn" onclick="Akun.reorder(\'' + o.id + '\')">' + IC("refresh-cw") + ' Order Ulang</button>' : '')
        + (o.resi ? '<a class="btn-sm" href="https://cekresi.com/?noresi=' + encodeURIComponent(o.resi) + '" target="_blank" rel="noopener">' + IC("mail") + ' Lacak Resi</a>' : '')
        + '<a class="btn-sm" href="https://wa.me/628129153811?text=' + encodeURIComponent('Halo Admin! Saya mau tanya tentang pesanan ' + o.id) + '" target="_blank" rel="noopener">💬 Tanya via WA</a>'
        + '</div></div></div>';
    }).join('');
  }

  function toggleOrder(el) {
    var detail = el.nextElementSibling;
    if (detail) detail.classList.toggle('open');
  }
  window.Akun = window.Akun || {};
  Akun.toggleOrder = toggleOrder;

  function timelineHtml(o) {
    var steps = [
      { label: 'Pesanan Dibuat', done: true },
      { label: 'Pembayaran', done: o.status !== 'Menunggu Konfirmasi' && o.status !== 'Menunggu Pembayaran' },
      { label: 'Diproses', done: o.status !== 'Menunggu Konfirmasi' && o.status !== 'Menunggu Pembayaran' && o.status !== 'Lunas' },
      { label: 'Dikirim', done: o.status === 'Dikirim' || o.status === 'Selesai' },
      { label: 'Selesai', done: o.status === 'Selesai' }
    ];
    return '<ul class="od-timeline">' + steps.map(function(s) {
      var cls = s.done ? 'done' : '';
      return '<li><div class="tl-dot ' + cls + '"></div><div><div class="tl-text ' + cls + '">' + s.label + '</div></div></li>';
    }).join('') + '</ul>';
  }

  // ── Tab Komplain ──
  function canKomplainAkun(o) {
    if (!o || o.status !== 'Selesai' || o.complaint) return false;
    var receivedAt = o.receivedDate ? new Date(o.receivedDate) : new Date(o.date);
    return new Date() < new Date(receivedAt.getTime() + 3 * 24 * 3600 * 1000);
  }
  function sisaWaktu(o) {
    var receivedAt = o.receivedDate ? new Date(o.receivedDate) : new Date(o.date);
    var dl = new Date(receivedAt.getTime() + 3 * 24 * 3600 * 1000);
    var diff = dl - new Date();
    if (diff <= 0) return 'habis';
    var d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000);
    return d > 0 ? d + ' hari ' + h + ' jam lagi' : h + ' jam lagi';
  }
  function renderKomplain(c) {
    setTitle('🛠️ Komplain');
    setSidebarActive('komplain');
    var komplain = state.orders.filter(function(o) { return o.complaint; }).sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
    var canAjukan = state.orders.filter(function(o) { return canKomplainAkun(o); });
    var html = '';
    if (canAjukan.length) {
      html += '<div class="komplain-ajukan"><div class="title">' + IC("wrench") + '️ Ajukan Komplain</div><div class="order-list">'
        + canAjukan.map(function(o) {
          return '<div class="order-item"><div class="oi-info"><div class="oi-id">' + SP.esc(o.id) + '</div><div class="oi-sisa">' + IC("clock") + ' ' + sisaWaktu(o) + '</div></div><button onclick="Akun.openKomplainForm(\'' + o.id + '\')">Ajukan</button></div>';
        }).join('') + '</div></div>';
    }
    if (komplain.length === 0) {
      html += '<div style="text-align:center;padding:40px;color:var(--muted);font-size:14px">Belum ada pengajuan komplain.</div>';
    } else {
      html += komplain.map(function(o) {
        var c = o.complaint || {};
        var st = c.status || 'Menunggu Diproses';
        var stCls = st === 'Selesai' || st === 'Diterima' ? 'st-selesai' : st === 'Ditolak' ? 'st-batal' : 'st-menunggu';
        var hist = Array.isArray(c.history) ? c.history : [];
        var photos = c.photos || {};
        var photoList = Object.entries(photos).filter(function(kv) { return kv[1]; });
        return '<div class="order-card" style="border-left:4px solid var(--red)">'
          + '<div class="order-summary" onclick="Akun.toggleOrder(this)">'
          + '<div class="order-head"><div class="order-id">' + IC("wrench") + '️ ' + SP.esc(o.id) + '</div><span class="status-badge ' + stCls + '">' + SP.esc(st) + '</span></div>'
          + '<div class="order-date">Diajukan ' + fmtDate(c.date || o.date) + '</div>'
          + '<div class="order-items">' + SP.esc(c.type || c.reason || 'Komplain') + '</div>'

  // ── Actions ──
  async function reorder(orderId) {
    var o = state.orders.find(function(x) { return x.id === orderId; });
    if (!o || !o.items) return;
    var cart = JSON.parse(localStorage.getItem('mp_cart') || '[]');
    (o.items || []).forEach(function(i) {
      var pid = i.productId || i.product_id;
      if (!pid) return;
      var existing = cart.find(function(c) { return c.id === pid; });
      if (existing) { existing.qty = (existing.qty || 1) + (i.qty || 1); }
      else { cart.push({ id: pid, productName: i.productName || i.product_name || '', variantName: i.variantName || '', variantId: i.variantId || i.variant_id || '', price: i.price || 0, qty: i.qty || 1, img: i.img || '' }); }
    });
    localStorage.setItem('mp_cart', JSON.stringify(cart));
    if (SP.updateCartBadge) SP.updateCartBadge();
    window.dispatchEvent(new CustomEvent('mp:cart'));
    window.location.href = '/checkout';
  }

  Akun.submitReview = async function(btn, pid) {
    var wrap = btn.closest('.rv-product');
    var stars = Number(wrap.querySelector('.rv-stars').dataset.stars) || 0;
    var comment = wrap.querySelector('.rv-textarea').value.trim();
    var status = wrap.querySelector('.rv-status');
    if (!stars) { status.textContent = '⚠️ Pilih rating dulu (1-5 bintang)'; return; }
    if (!comment) { status.textContent = '⚠️ Tulis komentar review dulu'; return; }
    btn.disabled = true; status.textContent = 'Mengirim...';
    var res = await api('/api/reviews', { method: 'POST', body: JSON.stringify({ product_id: pid, rating: stars, comment: comment }) });
    if (res.ok) {
      status.style.color = '#16A34A'; status.textContent = '✔ Review terkirim! Terima kasih.';
      wrap.querySelector('.rv-textarea').value = '';
      wrap.querySelector('.rv-stars').dataset.stars = 0;
      wrap.querySelectorAll('.rv-star').forEach(function(s) { s.classList.remove('sel'); });
      var t = await res.json();
      if (t.verified) status.textContent = '✔ Review terkirim! (Pembelian terverifikasi)';
      // Hapus dari reviewable dan re-render
      state.reviewable = state.reviewable.filter(function(p) { return p.id !== pid; });
      if (state.tab === 'review') renderTab();
      setTimeout(function() { btn.disabled = false; status.textContent = ''; status.style.color = ''; }, 2500);
    } else { status.textContent = '❌ Gagal mengirim. Coba lagi.'; btn.disabled = false; }
  };

  Akun.submitKmp = async function() {
    if (!komplainOrder) return;
    if (!komplainReason) { alert('Pilih alasan komplain dulu ya!'); return; }
    var desc = (document.getElementById('kmpDesc') || {}).value || '';
    if (!desc.trim()) { alert('Deskripsi masalah wajib diisi!'); return; }
    var payload = { date: new Date().toISOString(), desc: desc.trim() };
    if (komplainReason === 'barang_dana') {
      payload.type = 'Pengembalian Barang dan Dana';
      payload.refundAmount = komplainOrder.total;
    } else {
      if (komplainRefundType === 'sebagian') {
        if (!Object.keys(komplainRefundItems).length) { alert('Pilih minimal 1 produk yang bermasalah!'); return; }
        var total = 0;
        var itemsDesc = Object.entries(komplainRefundItems).map(function(e) {
          var i = Number(e[0]), q = e[1];
          var it = komplainOrder.items[i]; total += it.price * q;
          return (it.productName || it.name || 'Produk').replace(/\(.*?\)/g, '').trim().substring(0, 30) + (it.variantName ? ' (' + it.variantName + ')' : '') + ' x' + q;
        }).join(', ');
        payload.type = 'Pengembalian Dana Sebagian';
        payload.itemsDesc = itemsDesc;
        payload.refundAmount = total;
      } else {
        payload.type = 'Pengembalian Dana Penuh';
        payload.refundAmount = komplainOrder.total;
      }
    }
    var btn = document.querySelector('#kmpModal button:last-of-type');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Mengirim...'; }
    try {

      var o = state.orders.find(function(x) { return x.id === komplainOrder.id; });
      if (o) o.complaint = { ...payload, status: 'Menunggu Diproses' };
      var m = document.getElementById('kmpModal');
      if (m) {
        var waMsg = encodeURIComponent(
          '' + IC("wrench") + '️ *PENGAJUAN KOMPLAIN* — Murah Plastic%0A%0A'
          + '📋 No. Pesanan: *' + komplainOrder.id + '*%0A'
          + '❗ *Jenis:* ' + payload.type + '%0A'

          + '💰 *Estimasi Dana:* ' + SP.fmt(payload.refundAmount) + '%0A%0A'
          + 'Mohon kirimkan bukti via chat ini:%0A'
          + '📷 *Foto* produk yang bermasalah%0A'
          + '🎥 *Video unboxing* (singkat)%0A%0A'
          + 'Terima kasih ' + IC("hand") + ''
        );
        m.innerHTML = '<div style="background:#fff;border-radius:18px;max-width:480px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,.35);padding:28px 22px;text-align:center">'
          + '<div style="font-size:52px">' + IC("check-circle-2") + '</div>'
          + '<div style="font-size:17px;font-weight:900;color:var(--dark);margin-top:10px">Pengajuan Komplain Terkirim!</div>'
          + '<div style="font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6">Komplain order <b>' + komplainOrder.id + '</b> berhasil diajukan dan sudah masuk ke tim kami.</div>'
          + '<div style="font-size:13px;color:var(--muted);margin-top:4px;line-height:1.6">Sekarang kirim <b>foto & video unboxing</b> sebagai bukti via WhatsApp:</div>'
          + '<a href="https://wa.me/628129153811?text=' + waMsg + '" target="_blank" rel="noopener" style="display:block;background:#25D366;color:#fff;text-decoration:none;border-radius:14px;padding:14px;font-size:14px;font-weight:900;margin-top:16px">📲 Kirim Foto & Video Bukti via WhatsApp</a>'

          + '</div>';
      }
      renderTab();
    } catch (e) {
      alert('⚠️ Gagal mengirim pengajuan komplain. Cek koneksi internet lalu coba lagi.');
      if (btn) { btn.disabled = false; btn.textContent = 'Kirim Pengajuan Komplain →'; }
    }
  };

})();
